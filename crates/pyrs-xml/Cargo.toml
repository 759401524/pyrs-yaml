[package]
name = "pyrs-xml"
version = "0.19.1"
edition = "2024"
rust-version = "1.96"
description = "Read-only XML to YAML engine producing the shared pyrs-ast CustomNode — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_xml"

[dependencies]
# Same three dependencies as pyrs-csv. `default-features = false` keeps the
# tree no_std-clean; the `std` feature re-enables `indexmap/std` so the node
# map hasher matches `pyrs-ast`. There is no XML crate: the scanner is ours,
# so the DTD/entity attack surface never enters the dependency graph.
indexmap = { version = "2.7", default-features = false }
pyrs-ast = { path = "../pyrs-ast", version = "0.19.1", default-features = false }
pyrs-schema = { path = "../pyrs-schema", version = "0.19.1" }

[features]
default = ["std"]
std = ["indexmap/std", "pyrs-ast/std"]
