[package]
name = "pyrs-yaml-core"
version = "0.18.1"
edition = "2024"
rust-version = "1.96"
description = "Native YAML 1.2 engine — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_yaml_core"

[dependencies]
# `default-features = false` keeps the dependency tree `no_std`-clean; the
# `std` feature re-enables the std-only halves below.
indexmap = { version = "2.7", default-features = false }
# i18n is std-only by construction (rust-i18n reads locale files through std
# and owns a process-global locale), so the engine compiles its error-message
# catalog only when `std` is on.
rust-i18n = { version = "4.2", optional = true }
# The engine needs comment attachment in every build; `std` is what a bare
# `granit-parser` default would add on top.
granit-parser = { version = "2.0", default-features = false, features = ["comments", "error_messages"] }
# User-defined `!schema` rules are a runtime feature of the binding: `regex`
# is std-only here, so the YAML engine's own grammar never depends on it.
regex = { version = "1.11", optional = true }
thiserror = { version = "2", default-features = false }
pyrs-ast = { path = "../pyrs-ast", version = "0.18.1", default-features = false }
pyrs-event = { path = "../pyrs-event", version = "0.18.1", default-features = false }
pyrs-schema = { path = "../pyrs-schema", version = "0.18.1" }

[features]
# `std` is on by default so every existing host consumer (the Python binding,
# the CLI, the benches) keeps the exact API it had, including the i18n module
# and the runtime schema registry. `no_std` users opt out with
# `default-features = false` and get the parser, serializer, editing and
# splice layers without a global mutable registry or translated catalogs.
default = ["std"]
std = [
    "dep:rust-i18n",
    "dep:regex",
    "indexmap/std",
    "thiserror/std",
    "granit-parser/std",
    "pyrs-ast/std",
]
# Opt-in build of the instruction-count gate binary; see the `[[bench]] ir_gate`
# note below for why the target is feature-gated rather than always present.
ir-gate = []

[dev-dependencies]
# Cross-format property/integration suites (fmt_pbt, integration/*) exercise
# the sibling engines; they are dev-only so the YAML engine no longer links
# them for downstream consumers.
pyrs-json = { path = "../pyrs-json", version = "0.18.1" }
pyrs-toml = { path = "../pyrs-toml", version = "0.18.1" }
proptest = "1.5"
similar = "3"
pyrs-ast = { path = "../pyrs-ast", version = "0.18.1", features = ["test-strategy"] }

# Instruction-count gate. `harness = false` because the measurement is a fixed
# iteration loop with a companion setup-only pass: libtest's own timing harness
# would decide how many times the work runs, and a sample count that adapts to
# elapsed time makes the instruction total machine-dependent — the very property
# the gate exists to remove. See the module docs of `benches/ir_gate.rs`.
#
# `required-features` is load-bearing, not decoration: `cargo codspeed build`
# discovers every benchmark target and `cargo codspeed run` then executes each one
# with no arguments, so this binary — which needs a scenario name — was run as a
# benchmark and exited 2 (its own usage error), failing the `Rust benchmarks` job.
# Gating the target on a feature makes it invisible to every default build,
# CodSpeed included; only `scripts/ir_gate.py` turns it on.
[[bench]]
name = "ir_gate"
harness = false
required-features = ["ir-gate"]
