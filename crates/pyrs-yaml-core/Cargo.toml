[package]
name = "pyrs-yaml-core"
version = "0.11.7"
edition = "2021"
description = "Core YAML engine — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_yaml_core"

[features]
# Enable PyO3-dependent features (used as cfg gate for tests)
py = []

[dependencies]
indexmap = "2.7"
saphyr-parser = "0.0.11"
serde_json = "1.0"
rust-i18n = "4.2"

[dev-dependencies]
proptest = "1.11"
divan = "0.1.21"
tempfile = "3"