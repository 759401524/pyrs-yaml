[package]
name = "pyrs-yaml-core"
version = "0.15.0"
edition = "2024"
rust-version = "1.96"
description = "Core YAML engine — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_yaml_core"

[dependencies]
indexmap = "2.7"
rust-i18n = "4.2"
granit-parser = "1.3"
regex = "1.11"
thiserror = "2"
# JSON5 unquoted identifier keys need exact Unicode ID_Start / ID_Continue
# properties (all scripts, including combining marks); `std` does not expose
# those general categories. rustc's own lexer uses this same tiny crate.
unicode-ident = "1"

[dev-dependencies]
proptest = "1.5"
similar = "2"
