[package]
name = "pyrs-event"
version = "0.18.2"
edition = "2024"
rust-version = "1.96"
description = "Document event vocabulary shared by the pyrs-yaml engine family"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_event"

[dependencies]
# The event type names the node model's own `ScalarStyle` and `Tag`, so a stream and a tree built
# from it cannot disagree about what a style or a tag is. `default-features = false` keeps the
# dependency tree no_std-clean; feature unification gives `std` back wherever a std crate pulls it.
pyrs-ast = { path = "../pyrs-ast", version = "0.18.2", default-features = false }

[dev-dependencies]
# The property tier for the two jobs this crate owns generically: turning a byte offset into a
# position, and owning a borrowed event. `proptest` is already in the workspace (pyrs-yaml-core uses
# it), so this adds no new dependency to the project — only an edge in the lock file.
proptest = "1.5"

