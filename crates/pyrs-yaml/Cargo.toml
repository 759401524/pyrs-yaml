[package]
name = "pyrs-yaml"
version = "0.17.0"
edition = "2024"
rust-version = "1.96"
description = "High-performance Python YAML library with perfect round-trip support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"
keywords = ["yaml", "python", "pyo3", "round-trip", "high-performance"]
categories = ["parser-implementations", "encoding"]

[lib]
name = "pyrs_yaml"
crate-type = ["cdylib", "lib"]

[dependencies]
pyrs-yaml-core = { path = "../pyrs-yaml-core" }
pyrs-json = { path = "../pyrs-json" }
pyrs-toml = { path = "../pyrs-toml" }
pyo3 = { version = "0.29.2", features = ["experimental-inspect", "abi3-py38", "abi3t", "abi3t-py315"] }
numpy = { version = "0.29", optional = true }
indexmap = "2.7"
granit-parser = "1.3"

[build-dependencies]
pyo3-build-config = "0.29.2"

[features]
default = ["numpy"]
numpy = ["dep:numpy"]
# Opt-in build of the instruction-count harness binary below. Nothing in the shipped
# extension depends on it: the seam (`bench_to_python`) is compiled out of every build that does not
# ask for it, so the Python-visible surface is unchanged by adding a performance target.
ir-gate = []

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5.0" }

[[bench]]
name = "yaml_bench"
harness = false

# The binding-side half of the instruction-count gate. `pyrs-yaml-core`'s harness cannot reach the
# AST-to-Python conversion (it never links this crate), which is the registered hole
# `perf-coverage:binding-layer`; these scenarios close it.
#
# `required-features` is load-bearing, not decoration: `cargo codspeed build` discovers every
# benchmark target and `cargo codspeed run` executes each with no arguments, so a scenario-name-only
# binary would exit 2 and fail the `Rust benchmarks` job. Gating it keeps the target out of every
# default build, CodSpeed included - the same arrangement as `pyrs-yaml-core`'s `ir_gate`.
[[bench]]
name = "ir_gate"
harness = false
required-features = ["ir-gate"]
