[package]
name = "pyrs-ast"
version = "0.18.3"
edition = "2024"
rust-version = "1.96"
description = "Format-agnostic AST + shared error types for the pyrs-yaml engine family"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_ast"

[dependencies]
# `default-features = false` keeps the dependency tree `no_std`-clean; the
# `std` feature re-enables `thiserror/std` for `std::error::Error` impls.
indexmap = { version = "2.7", default-features = false }
thiserror = { version = "2", default-features = false }
# Property-test node strategies live behind an opt-in feature so the crate has
# zero dev-facing proptest cost by default (keeps no_std / minimal builds clean);
# the engine crate enables it only from its dev-dependencies.
proptest = { version = "1.5", optional = true }

[features]
# `std` is on by default so that every existing consumer keeps the exact
# `std::error::Error` impls it already wrote; `no_std` users opt out with
# `default-features = false`. The node map no longer depends on this: one
# fixed-seed hasher serves both sides of the split (see `ast::NodeMap`), so
# enabling `std` adds impls and never changes a type.
default = ["std"]
# Turning this on re-enables `thiserror/std` (std::error::Error impls) and
# `indexmap/std`. Cargo unifies features across the whole graph, and the
# node-map type is named with its hasher either way, so no crate can end up
# with two different `NodeMap`s.
std = ["thiserror/std", "indexmap/std"]
test-strategy = ["dep:proptest"]
