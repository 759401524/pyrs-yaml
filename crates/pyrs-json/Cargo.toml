[package]
name = "pyrs-json"
version = "0.18.0"
edition = "2024"
rust-version = "1.96"
description = "Native JSON/JSONC/JSON5 engine (RFC 8259 grammar) producing the shared pyrs-ast CustomNode — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_json"

[dependencies]
# `default-features = false` keeps the tree `no_std`-clean; the `std` feature
# below re-enables `indexmap/std` so the node-map hasher matches `pyrs-ast`.
indexmap = { version = "2.7", default-features = false }
# JSON5 unquoted identifier keys need exact Unicode ID_Start / ID_Continue
# properties (all scripts, including combining marks); `std` does not expose
# those general categories. rustc's own lexer uses this same tiny crate.
unicode-ident = "1"
pyrs-ast = { path = "../pyrs-ast", version = "0.18.0", default-features = false }
# The event vocabulary the tree-free producer reports. `pyrs-event` is `no_std` + `alloc` and names
# only `pyrs-ast` types, so this edge adds no engine to a downstream reader of the stream.
pyrs-event = { path = "../pyrs-event", version = "0.18.0", default-features = false }
pyrs-schema = { path = "../pyrs-schema", version = "0.18.0" }

[features]
# `std` is on by default for the host test harness; `no_std` users opt out
# with `default-features = false` (CI gate: the `no-std-check` job). The node
# map is the same fixed-seed type on both sides.
default = ["std"]
std = ["indexmap/std", "pyrs-ast/std"]
