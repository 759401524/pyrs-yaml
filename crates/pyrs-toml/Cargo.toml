[package]
name = "pyrs-toml"
version = "0.18.2"
edition = "2024"
rust-version = "1.96"
description = "Native TOML 1.0/1.1 engine producing the shared pyrs-ast CustomNode — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_toml"

[dependencies]
# `default-features = false` keeps the tree `no_std`-clean; the `std` feature
# below re-enables `indexmap/std` so the node-map hasher matches `pyrs-ast`.
indexmap = { version = "2.7", default-features = false }
pyrs-ast = { path = "../pyrs-ast", version = "0.18.2", default-features = false }
pyrs-schema = { path = "../pyrs-schema", version = "0.18.2" }
# The event vocabulary the tree-free producer reports. `pyrs-event` is `no_std` + `alloc` and names
# only `pyrs-ast` types, so this edge adds no engine to a downstream reader of the stream.
pyrs-event = { path = "../pyrs-event", version = "0.18.2", default-features = false }

[features]
# `std` is on by default for the host test harness; `no_std` users opt out
# with `default-features = false` (CI gate: the `no-std-check` job). The node
# map is the same fixed-seed type on both sides.
default = ["std"]
std = ["indexmap/std", "pyrs-ast/std"]
