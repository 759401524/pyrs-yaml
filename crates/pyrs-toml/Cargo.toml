[package]
name = "pyrs-toml"
version = "0.17.0"
edition = "2024"
rust-version = "1.96"
description = "Native TOML 1.0/1.1 engine producing the shared pyrs-ast CustomNode — pure Rust, no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyrs-yaml"

[lib]
name = "pyrs_toml"

[dependencies]
# `default-features = false` keeps the tree `no_std`-clean; the `std` feature
# below re-enables `indexmap/std` so the node-map hasher matches `pyrs-ast`.
indexmap = { version = "2.7", default-features = false }
pyrs-ast = { path = "../pyrs-ast", version = "0.17.0", default-features = false }
pyrs-schema = { path = "../pyrs-schema", version = "0.17.0" }

[features]
# `std` is on by default so existing consumers keep the exact
# `IndexMap<K, V, RandomState>` node-map type; `no_std` users opt out with
# `default-features = false` (CI gate: the `no-std-check` job).
default = ["std"]
std = ["indexmap/std", "pyrs-ast/std"]
