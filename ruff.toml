target-version = "py39"
line-length = 120
respect-gitignore = true

[lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "SIM", "LOG", "PYI", "PTH", "RUF"]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[lint.per-file-ignores]
"tests/**" = ["B008"]

[lint.isort]
known-first-party = ["pyyaml_rs"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"