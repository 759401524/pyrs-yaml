[package]
name = "pyrs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: fuzz targets are nightly+sanitizer builds and must not
# join the main `[workspace]` (CI's stable builds and the release profile there
# would otherwise try to compile libFuzzer instrumentation).
[workspace]

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
pyrs-yaml-core = { path = "../crates/pyrs-yaml-core" }
pyrs-json = { path = "../crates/pyrs-json" }
pyrs-toml = { path = "../crates/pyrs-toml" }
pyrs-schema = { path = "../crates/pyrs-schema" }
# The replay target compares the notes the two walks report, and a note is two facts now - the
# source fact and the owner - so it names the vocabulary that carries them.
pyrs-event = { path = "../crates/pyrs-event" }
# The replay target walks the tree that `pyrs-json` builds, so it names the node type
# directly; every other target stays behind an engine's own API and never mentions it.
pyrs-ast = { path = "../crates/pyrs-ast" }

[[bin]]
name = "parse_yaml"
path = "fuzz_targets/parse_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_roundtrip"
path = "fuzz_targets/yaml_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_json"
path = "fuzz_targets/parse_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_toml"
path = "fuzz_targets/parse_toml.rs"
test = false
doc = false
bench = false

# Round-trip halves of the JSON and TOML families. The `parse_*` targets already call each
# writer and re-read its output, then throw the result away - so they prove the reader
# accepts its own writer, not that the writer has settled. These two assert the fixed point
# `yaml_roundtrip` asserts, per dialect.
[[bin]]
name = "json_roundtrip"
path = "fuzz_targets/json_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "toml_roundtrip"
path = "fuzz_targets/toml_roundtrip.rs"
test = false
doc = false
bench = false

# The schema language is a second grammar with its own parser: every other target feeds the engine a
# document, and a schema definition is the input only this one reaches. It has no writer to round-trip,
# so parsing is the whole contract.
[[bin]]
name = "parse_schema"
path = "fuzz_targets/parse_schema.rs"
test = false
doc = false
bench = false

# The JSON producer is a second walk over the same scanners, so it can disagree with the tree
# route about a verdict, a position, or what a token reads as. `json_roundtrip` proves the writer
# settles; nothing else proves the two readers describe the same document, and a corpus test only
# asks the shapes someone thought of. This target asks arbitrary ones.
[[bin]]
name = "json_events_replay"
path = "fuzz_targets/json_events_replay.rs"
test = false
doc = false
bench = false

# The edit verbs. Every target above hands the engine a document; none of them hands it a *change* to
# a document, which is the layer that rewrites one region of the text and the layer the round-trip
# promise is about. Its tests are named shapes, and a named shape cannot reach the combination that
# breaks a splice - so this one takes `document NUL script`, picks paths the reader really found, and
# requires each accepted edit to re-parse, to settle in one round, and to leave the value it wrote
# where it says it wrote it.
[[bin]]
name = "edit_yaml"
path = "fuzz_targets/edit_yaml.rs"
test = false
doc = false
bench = false
