# rumdl configuration — Markdown linting for pyyaml-rs
# https://rumdl.dev/configuration/

[global]
extend-disable = ["MD013", "MD051", "MD036", "MD038"]  # MD013 counts characters, not display columns, and `rumdl fmt` does not re-wrap prose at all (measured: a 587-char line passes through unchanged) — width is enforced by the `doc-line-width` hook instead; MD051 false-positive on CJK anchors (rumdl slugs are ASCII-only, but GitHub/mkdocs keep CJK); MD038 *deletes* a space at either end of a code span, and in these pages that byte is content — a YAML/TOML sample's indentation is the shape (reproduced on 2026-11-01: `` ` ? > #I` `` came out of `rumdl fmt` as `` `? > #I` ``, reported only `[MD038] ... [fixed]`, and five changelog mirrors plus `docs/dev/quality-ledger.md` lost the same byte while the hook printed `Passed`). `rumdl check` over all 178 tracked pages reports 0 MD038 findings today, so the rule is currently buying nothing here; what it would buy is a lint for a space that renders invisibly (both ends), and that is the author's cue to fence the sample instead — `docs/dev/quality-ledger.md` `(id)` carries the measurement and the trade
flavor = "mkdocs"
exclude = [
    ".git",
    ".github",
    "site",
    "dist",
    "target",
    ".venv",
    ".pytest_cache",
    ".benchmarks",
    "node_modules",
]

respect-gitignore = true

[per-file-ignores]
# Each changelog page folds its released versions in <details>/<summary> so the file reads as a list
# of releases instead of a wall of prose. Raw HTML is the only fold that works on GitHub, where the
# root CHANGELOG.md is read, so the inline-HTML rule is scoped away for those five pages only.
# The localized pages put version headings at the same level as their section headings
# (`### [v0.18.1]` beside `### Fixed`), so every release's `Fixed` is a sibling of the previous
# one and MD024 reports a duplicate the structure creates, not the author.
"CHANGELOG.md" = ["MD033"]
"docs/en/changelog.md" = ["MD033", "MD024"]
"docs/zh/changelog.md" = ["MD033", "MD024"]
"docs/ja/changelog.md" = ["MD033", "MD024"]
"docs/ko/changelog.md" = ["MD033", "MD024"]
# CLAUDE.md: no H1 heading, uses <comet-ambient-resume> HTML tags
"CLAUDE.md" = ["MD033", "MD041"]
# AGENTS.md: uses <comet-ambient-resume> HTML tags
"AGENTS.md" = ["MD033"]
# Docs: mkdocs frontmatter (---) means no H1 on first line
"docs/**/*.md" = ["MD041"]
