# rumdl configuration — Markdown linting for pyyaml-rs
# https://rumdl.dev/configuration/

[global]
extend-disable = ["MD013", "MD051", "MD036"]  # MD013 counts characters, not display columns, and `rumdl fmt` does not re-wrap prose at all (measured: a 587-char line passes through unchanged) — width is enforced by the `doc-line-width` hook instead; MD051 false-positive on CJK anchors (rumdl slugs are ASCII-only, but GitHub/mkdocs keep CJK)
flavor = "mkdocs"
exclude = [
    ".git",
    ".github",
    "site",
    "dist",
    "target",
    ".venv",
    ".pytest_cache",
    ".benchmarks",
    "node_modules",
]

respect-gitignore = true

[per-file-ignores]
# Each changelog page folds its released versions in <details>/<summary> so the file reads as a list
# of releases instead of a wall of prose. Raw HTML is the only fold that works on GitHub, where the
# root CHANGELOG.md is read, so the inline-HTML rule is scoped away for those five pages only.
"CHANGELOG.md" = ["MD033"]
"docs/en/changelog.md" = ["MD033"]
"docs/zh/changelog.md" = ["MD033"]
"docs/ja/changelog.md" = ["MD033"]
"docs/ko/changelog.md" = ["MD033"]
# CLAUDE.md: no H1 heading, uses <comet-ambient-resume> HTML tags
"CLAUDE.md" = ["MD033", "MD041"]
# AGENTS.md: uses <comet-ambient-resume> HTML tags
"AGENTS.md" = ["MD033"]
# Docs: mkdocs frontmatter (---) means no H1 on first line
"docs/**/*.md" = ["MD041"]
