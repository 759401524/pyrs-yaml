[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyrs-yaml"
dynamic = ["version"]
description = "High-performance Python library for YAML, TOML, JSON, JSONC and JSON5 with perfect round-trip support, built with Rust and PyO3"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
keywords = ["yaml", "parser", "round-trip", "high-performance", "rust"]
authors = [
    {name = "MuLong", email = "759401524@qq.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
cli = ["cyclopts>=4,<5; python_version >= '3.10'"]
pydantic = ["pydantic>=2.10.6"]
settings = ["pydantic-settings>=2.13.0; python_version >= '3.10'"]

[project.scripts]
pyrs-yaml = "pyrs_yaml.cli:main"

[project.urls]
Homepage = "https://github.com/759401524/pyrs-yaml"
Documentation = "https://759401524.github.io/pyrs-yaml"
Repository = "https://github.com/759401524/pyrs-yaml"
Issues = "https://github.com/759401524/pyrs-yaml/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "pyrs_yaml"
python-source = "python"
manifest-path = "crates/pyrs-yaml/Cargo.toml"
strip = true
auditwheel = "repair"

include = ["LICENSE-APACHE", "LICENSE-MIT"]

[tool.maturin.generate-ci.github]
platforms = ["linux", "windows", "macos"]
pytest = true
zig = true
interpreter = "3.8"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-codspeed>=2.0",
    "pytest-asyncio>=0.23",
    "cyclopts>=4,<5; python_version >= '3.10'",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.13.0; python_version >= '3.10'",
    # Every upper cap below is the highest band that publishes a wheel for this interpreter on all
    # three shipped OSes, measured with `uv pip install --dry-run --no-build` against real
    # interpreters (and `uv pip compile --no-build --python-platform` for the macOS GIL bands).
    # PEP 508 has no free-threading marker, so a cap admits 3.14t and 3.15t as well: `orjson` and
    # `rtoml` stop below 3.14 because neither ships a 3.14t wheel, and `pyjson5`, `ryaml` and
    # `yaml-edit` stop below 3.15 because none of the three ships one for 3.15 on any OS.
    "numpy>=1.16.0; python_version < '3.16' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "PyYAML>=6.0",
    "ruamel-yaml>=0.18.16",
    "ryaml>=0.5.0; python_version >= '3.10' and python_version < '3.15' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "yaml-edit>=0.1.2; python_version >= '3.10' and python_version < '3.15' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "yaml-rs>=0.1.0; python_version >= '3.10' and python_version < '3.16' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "orjson>=3.9; python_version >= '3.9' and python_version < '3.14' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "ujson>=5.8; python_version >= '3.9' and python_version < '3.16' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "python-rapidjson>=1.18; python_version >= '3.9' and python_version < '3.16' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "tomlkit>=0.12",
    # rtoml is the `toml-rs` crate's Python binding, so it is the only TOML counterparty on the
    # table that is Rust against Rust. Its floor is 3.10 and it publishes no free-threaded wheel,
    # which is why its cap sits below 3.14 like `orjson`'s instead of at 3.15 like `pyjson5`'s.
    "rtoml>=0.14; python_version >= '3.10' and python_version < '3.14'",
    "tomli>=2.0; python_version < '3.11'",
    "pyjson5>=1.6; python_version >= '3.9' and python_version < '3.15' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "json5>=0.17.3",
    "jsonschema>=4.18.0,<4.25.1; python_version < '3.9'",
    "jsonschema>=4.25.1; python_version >= '3.9'",
    "hypothesis>=6.113.0",
    "arrow>=1.3.0",
    "pendulum>=2.1.2; python_version >= '3.9'",
    "python-ulid>=2.7.0; python_version >= '3.9'",
]
lint = [
    "ruff>=0.5.0,<0.10.0; python_version < '3.9'",
    "ruff>=0.14.0; python_version >= '3.9'",
]
dev = [
    "maturin>=1.0,<2.0",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]
docs = [
    "mkdocstrings-python>=2.0.9; python_version >= '3.11'",
    "tomli-w>=1.0.0",
    "zensical>=0.0.69; python_version >= '3.11'",
]
