[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyrs-yaml"
dynamic = ["version"]
description = "High-performance Python YAML library with perfect round-trip support"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
keywords = ["yaml", "parser", "round-trip", "high-performance", "rust"]
authors = [
    {name = "MuLong", email = "759401524@qq.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.10.6"]

[project.urls]
Homepage = "https://github.com/759401524/pyrs-yaml"
Documentation = "https://759401524.github.io/pyrs-yaml"
Repository = "https://github.com/759401524/pyrs-yaml"
Issues = "https://github.com/759401524/pyrs-yaml/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "pyrs_yaml"
python-source = "python"
manifest-path = "crates/pyrs-yaml/Cargo.toml"
features = ["pyo3/extension-module"]
strip = true
auditwheel = "repair"

[tool.maturin.generate-ci.github]
platforms = ["linux", "windows", "macos"]
pytest = true
zig = true
interpreter = "3.8"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-codspeed>=2.0",
    "pytest-asyncio>=0.23",
    "pydantic>=2.10.6",
    "numpy>=1.16.0; python_version < '3.14' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "PyYAML>=6.0",
    "ruamel-yaml>=0.18.16",
    "ryaml>=0.5.0; python_version >= '3.10' and platform_machine != 'armv7l' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "yaml-edit>=0.1.2; python_version >= '3.10' and platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "jsonschema>=4.18.0,<4.25.1; python_version < '3.9'",
    "jsonschema>=4.25.1; python_version >= '3.9'",
]
lint = [
    "ruff>=0.5.0,<0.10.0; python_version < '3.9'",
    "ruff>=0.14.0; python_version >= '3.9'",
]
dev = [
    "maturin>=1.0,<2.0",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]
docs = [
    "mkdocstrings-python>=1.11.1",
    "tomli-w>=1.0.0",
    "zensical>=0.0.2",
]
