[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyyaml-rs"
dynamic = ["version"]
description = "High-performance Python YAML library with perfect round-trip support"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.9"
keywords = ["yaml", "parser", "round-trip", "high-performance", "rust"]
authors = [
    {name = "MuLong", email = "759401524@qq.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: YAML",
]
dependencies = [
]

[project.optional-dependencies]
jsonschema = ["jsonschema>=4.25.1"]

[project.urls]
Homepage = "https://github.com/759401524/pyyaml-rs"
Documentation = "https://github.com/759401524/pyyaml-rs#readme"
Repository = "https://github.com/759401524/pyyaml-rs"
Issues = "https://github.com/759401524/pyyaml-rs/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "pyyaml_rs"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
auditwheel = "repair"

[tool.maturin.generate-ci.github]
platforms = ["linux", "windows", "macos"]
pytest = true
zig = true
interpreter = "3.9"

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-asyncio>=0.23",
    "numpy>=1.16.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=1.18.2",
    "ruff>=0.14.0",
    "rumdl>=0.2.43",
    "prek>=0.1.0",
]
