[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyyaml-rs"
version = "0.2.0"
description = "High-performance Python YAML library with perfect round-trip support"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.9"
keywords = ["yaml", "parser", "round-trip", "high-performance", "rust"]
authors = [
    {name = "MuLong"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: YAML",
]

[project.urls]
Homepage = "https://github.com/MuLong/pyyaml-rs"
Documentation = "https://github.com/MuLong/pyyaml-rs#readme"
Repository = "https://github.com/MuLong/pyyaml-rs"
Issues = "https://github.com/MuLong/pyyaml-rs/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pyyaml_rs"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
url = "https://mirrors.cernet.edu.cn/pypi/web/simple"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=1.18.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "i18n: marks tests that check internationalization",
]
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
log_cli = "true"
log_cli_level = "WARNING"
