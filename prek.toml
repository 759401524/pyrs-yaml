# Prek configuration — Git hooks for pyyaml-rs
# Run `prek install --prepare-hooks` to install the Git shims.
# Run `prek run --all-files` to manually trigger all hooks.

default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit"]
minimum_prek_version = "0.1.0"

# Exclude generated and cache directories
exclude = { glob = ["target/**", "dist/**", ".venv/**", ".pytest_cache/**", ".benchmarks/**", "site/**", "node_modules/**"] }

# Priorities: format first, then lint, then tests
[priorities]
format = 0
checks = 10

# ── Built-in fast hooks (zero network, zero setup) ──────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", priority = "checks" },
  { id = "check-merge-conflict", priority = "checks" },
  { id = "check-yaml", priority = "checks" },
  { id = "check-toml", priority = "checks" },
  { id = "detect-private-key", priority = "checks" },
  # Fuzz seeds are byte-exact fuzzer inputs in which trailing whitespace is
  # semantic: `!y5%7c ` is a tag plus its required separator, and stripping the
  # space leaves a 6-byte input that no longer reproduces the crash it was added
  # for. Keep the hygiene hook off the fuzz input trees.
  { id = "trailing-whitespace", priority = "format", exclude = { glob = ["fuzz/seeds/**", "fuzz/corpus/**", "fuzz/artifacts/**"] } },
  # Line endings, the same declaration `.gitattributes` makes. Nothing else in the gate
  # set reads them, so a helper script that wrote a tracked file with the platform default
  # newline produced a 600-2,500 line diff out of a dozen changed lines and passed every
  # test - measured, five changelogs and ten other tracked files carried the CRLF into
  # main before anything looked. Fuzz trees are excluded for the reason above: a seed's
  # CR bytes are the input, not formatting. Two further files are excluded because their
  # CRLFs sit inside raw strings the Ir baseline was measured against - see
  # `scripts/check_line_endings.py`, which keeps the same list.
  #
  # `mixed-line-ending` alone is NOT the policy: it fires on a file that mixes endings,
  # and a file that is entirely CRLF - the actual failure mode here, produced by a writer
  # using the platform default - reads as consistent and passes. Verified, not assumed:
  # injecting all-CRLF into a file left this hook Passed while the script below reported
  # the line count. So the absolute rule is enforced by its own hook, next down.
  {
    id = "mixed-line-ending",
    priority = "checks",
    args = ["--fix=lf"],
    exclude = {
      glob = [
        "fuzz/seeds/**",
        "fuzz/corpus/**",
        "fuzz/artifacts/**",
        "crates/pyrs-yaml-core/src/bench_inputs.rs",
        "crates/pyrs-yaml-core/benches/ir_gate.rs",
      ],
    },
  },
]

# ── Rust: cargo fmt + clippy ────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt -- --check"
files = "\\.(rs|toml|lock)$"
pass_filenames = false
priority = "format"

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy -- -D warnings"
files = "\\.(rs|toml|lock)$"
pass_filenames = false
priority = "checks"

# The absolute line-ending rule, which `mixed-line-ending` does not express: it reports a
# file that mixes endings and stays quiet on one that is entirely CRLF - the shape this
# repository actually accumulated. Measured before adopting: an injected all-CRLF file
# left the builtin hook `Passed` while this script named its line count. It walks tracked
# *and* newly created files, because the failure arrives at creation time.
[[repos.hooks]]
id = "line-endings-lf"
name = "text files are LF-only"
language = "system"
entry = "python scripts/check_line_endings.py"
pass_filenames = false
priority = "checks"

[[repos.hooks]]
id = "changelog-mirror-sync"
name = "changelog mirror sync"
language = "system"
entry = "python scripts/check_changelog_mirrors.py"
files = "^(CHANGELOG\\.md|docs/(en|ja|ko|zh)/changelog\\.md)$"
priority = "checks"

# Each localized page must stay in its own writing system. Translations written with
# an assistant drift into neighbouring scripts (simplified Han in ja, kana in ko) and
# a human reviewer reading that language often cannot tell, because the intruding
# glyph looks like a variant of the intended one. Scope is every page, not just the
# changelog: the Korean changelog shipped clauses of Chinese prose while the gate was
# pinned to the changelog's `[Unreleased]` block and to a curated codepoint list.
[[repos.hooks]]
id = "cjk-localisation"
name = "localized script purity"
language = "system"
entry = "python scripts/check_cjk_localisation.py"
files = "^docs/(ja|ko|zh)/.*\\.md$"
priority = "checks"

[[repos.hooks]]
id = "i18n-check"
name = "i18n doc check"
language = "system"
entry = "python scripts/check_i18n.py"
files = "^docs/(en|ja|ko|zh)/.*\\.md$"
priority = "checks"

# A wrapped paragraph whose continuation line starts with an issue reference (`#292 branch
# as written, ...`) is not a continuation to a Markdown formatter: `rumdl fmt` promotes it
# into a heading, blanks around it, and the sentence is left split across a heading. Three
# such headings were in the tree at once while every gate stayed green, because a document
# with a bogus heading is still valid Markdown - nothing asked whether the heading was
# meant. The mechanism was reproduced, not inferred: a scratch file with the continuation
# line came out of `rumdl fmt` with `## 292 branch as written, and more`. The rule is a
# heading whose text starts with two or more digits not followed by a dot, measured against
# every tracked page so it fires on the damage and on none of `### 1-D array`,
# `#### 10. メタデータの操作` or `## 1. Test matrix coverage`.
[[repos.hooks]]
id = "doc-heading-integrity"
name = "no split-sentence headings"
language = "system"
entry = "python scripts/check_doc_headings.py"
files = "\\.md$"
priority = "checks"

# Prose here is hard-wrapped, and nothing enforced the wrap: `ROADMAP.md` reached one line of
# 21,850 characters, and the localized changelogs reached 884 because a tool that only breaks at
# spaces cannot wrap CJK at all. `rumdl fmt` stays the repository's Markdown formatter - excluding it
# left `MD007`/`MD012` findings on six lines it had been keeping honest - but measured through stdin
# it does not re-wrap prose at all: a 587-character English line and a 319-column Korean one pass
# straight through, and `line-length` configures only the linter, whose `MD013` this repository
# disables. So width was unowned until this hook, which reports any prose line past 100 **display
# columns** (fullwidth = 2) that a legal cut could bring inside, and skips the four whose shortest
# legal cut is already past the limit - each opens with a 101-127 column code span that must not be
# split. `--fix` reflows exactly the reported lines, which is what keeps two passes from overwriting
# each other; the probe that alternates them settles with neither rewriting anything. Scope is the six
# pages whose prose this repository grows continuously: the five release-note pages, the roadmap, and
# the development records under `docs/dev/` (quality ledger, engine boundaries, performance status) -
# outside the published site, so they carry no i18n mirror obligation but the same typographic one. The
# docs tree keeps its own wrapping.
[[repos.hooks]]
id = "doc-line-width"
name = "prose fits 100 display columns"
language = "system"
entry = "python scripts/check_doc_wrapping.py"
files = "^(CHANGELOG|ROADMAP)\\.md$|^docs/(en|ja|ko|zh)/changelog\\.md$|^docs/dev/[a-z-]+\\.md$"
priority = "checks"

# Every published page opens with a YAML block that decides its title, its `<meta description>`, its
# tags and its place in the navigation. The width fixer was written to skip that block and skipped only
# its opening `---`, so the body was joined and re-wrapped as prose: `title:`/`description:`/`tags:` on
# one line is not a mapping. The locked generator publishes such a page anyway, with the page's own
# description replaced by the site's; the newer one fails the build with `error reading page metadata`.
# A green deploy proved nothing either way, and the site is built on push to `main` rather than on pull
# requests, so three merged pull requests carried it. Structural rules only, so this hook needs nothing
# but the standard library. The second rule belongs here for the same reason: `md_in_html` parses the
# body of a raw HTML block only when the opening tag carries the `markdown` attribute, and a fold
# without it prints its own `####` headings, lists and code fences as text - which is how all 21 folded
# releases arrived on the site. GitHub parses `<details>` bodies either way, so the source looked right
# wherever a human read it.
[[repos.hooks]]
id = "doc-metadata"
name = "page metadata parses and folds render"
language = "system"
entry = "python scripts/check_doc_metadata.py"
files = "^docs/(en|ja|ko|zh)/.*\\.md$"
priority = "checks"

# The file an agent trusts most was the one artefact outside the quality gate. `AGENTS.md` described
# `mkdocstrings` as configured-and-rendering-nothing and named `docs-generation:plugin-unused` as an open hole
# for a whole milestone after #321 had closed it, because the matrix compared the registry with the derived
# document and nothing read the prose - and the sentence was not merely stale, it pointed the next agent the
# wrong way about what to do with an API page. The rule is narrow on purpose: an id counts as a hole id only
# when `scripts/quality_matrix.py` can emit its kind, which is read off the probe rather than listed here, so
# `line:column` in a changelog entry is not a claim; and a named id must be one the measurement reproduces now.
# History keeps its ids - the five release-note pages and `docs/dev/quality-ledger.md` are dated records. An
# instruction file is present tense, which is why only the two agent files are in scope.
[[repos.hooks]]
id = "hole-claims"
name = "instruction files name measured holes"
language = "system"
entry = "python scripts/check_hole_claims.py"
files = "^(AGENTS|CLAUDE)\\.md$"
priority = "checks"

# ── Python: ruff lint + format ──────────────────────────────────────────────
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.10"
hooks = [
  { id = "ruff", args = ["--fix"], priority = "checks" },
  { id = "ruff-format", priority = "format" },
]

# ── Markdown: rumdl lint + format ───────────────────────────────────────────
[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.78"
hooks = [
  { id = "rumdl", priority = "checks" },
  { id = "rumdl-fmt", priority = "format" },
]
