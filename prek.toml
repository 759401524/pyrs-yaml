# Prek configuration — Git hooks for pyyaml-rs
# Run `prek install --prepare-hooks` to install the Git shims.
# Run `prek run --all-files` to manually trigger all hooks.

default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit"]
minimum_prek_version = "0.1.0"

# Exclude generated and cache directories
exclude = { glob = ["target/**", "dist/**", ".venv/**", ".pytest_cache/**", ".benchmarks/**", "site/**", "node_modules/**"] }

# Priorities: format first, then lint, then tests
[priorities]
format = 0
checks = 10

# ── Built-in fast hooks (zero network, zero setup) ──────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", priority = "checks" },
  { id = "check-merge-conflict", priority = "checks" },
  { id = "check-yaml", priority = "checks" },
  { id = "check-toml", priority = "checks" },
  { id = "detect-private-key", priority = "checks" },
  # Fuzz seeds are byte-exact fuzzer inputs in which trailing whitespace is
  # semantic: `!y5%7c ` is a tag plus its required separator, and stripping the
  # space leaves a 6-byte input that no longer reproduces the crash it was added
  # for. Keep the hygiene hook off the fuzz input trees.
  { id = "trailing-whitespace", priority = "format", exclude = { glob = ["fuzz/seeds/**", "fuzz/corpus/**", "fuzz/artifacts/**"] } },
  # Line endings, the same declaration `.gitattributes` makes. Nothing else in the gate
  # set reads them, so a helper script that wrote a tracked file with the platform default
  # newline produced a 600-2,500 line diff out of a dozen changed lines and passed every
  # test - measured, five changelogs and ten other tracked files carried the CRLF into
  # main before anything looked. Fuzz trees are excluded for the reason above: a seed's
  # CR bytes are the input, not formatting. Two further files are excluded because their
  # CRLFs sit inside raw strings the Ir baseline was measured against - see
  # `scripts/check_line_endings.py`, which keeps the same list.
  #
  # `mixed-line-ending` alone is NOT the policy: it fires on a file that mixes endings,
  # and a file that is entirely CRLF - the actual failure mode here, produced by a writer
  # using the platform default - reads as consistent and passes. Verified, not assumed:
  # injecting all-CRLF into a file left this hook Passed while the script below reported
  # the line count. So the absolute rule is enforced by its own hook, next down.
  {
    id = "mixed-line-ending",
    priority = "checks",
    args = ["--fix=lf"],
    exclude = {
      glob = [
        "fuzz/seeds/**",
        "fuzz/corpus/**",
        "fuzz/artifacts/**",
        "crates/pyrs-yaml-core/src/bench_inputs.rs",
        "crates/pyrs-yaml-core/benches/ir_gate.rs",
      ],
    },
  },
]

# ── Rust: cargo fmt + clippy ────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt -- --check"
files = "\\.(rs|toml|lock)$"
pass_filenames = false
priority = "format"

# `fuzz/` declares its own `[workspace]`, so the hook above never reaches its targets: `cargo fmt`
# at the root formats the main workspace only. Measured 2026-10-17: the targets added by 39b1b9eb
# and 5f5262aa were unformatted while every gate stayed green. The manifest is in `files` because
# the edition it declares is part of what rustfmt decides; a separate hook is needed because
# `entry` is executed without a shell.
[[repos.hooks]]
id = "cargo-fmt-fuzz"
name = "cargo fmt (fuzz workspace)"
language = "system"
entry = "cargo fmt --manifest-path fuzz/Cargo.toml -- --check"
files = "^fuzz/.*(\\.rs|Cargo\\.toml)$"
pass_filenames = false
priority = "format"

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy -- -D warnings"
files = "\\.(rs|toml|lock)$"
pass_filenames = false
priority = "checks"

# The hook above compiles neither Ir harness, and neither does CI's wider `--all-targets`: both
# `benches/ir_gate.rs` files sit behind `required-features = ["ir-gate"]`, and cargo drops a target
# whose required features are off instead of checking it. Measured 2026-10-29 by planting a type
# error in each harness in turn - the plain and the `--all-targets` commands both reported a clean
# tree, this command exited 101 naming the planted line. Scoped to the two harnesses the way
# `cargo-fmt-fuzz` scopes the fuzz workspace, so a commit touching anything else pays one narrow
# check rather than a second full-tree lint. `ci.yml`'s `hooks` job skips both clippy hooks: its
# toolchain installs no `clippy` component, and `rust-lint` runs the same two commands with a warm
# build cache.
[[repos.hooks]]
id = "cargo-clippy-ir-harness"
name = "cargo clippy (Ir harnesses)"
language = "system"
entry = "cargo clippy -p pyrs-yaml-core -p pyrs-yaml --bench ir_gate --features ir-gate -- -D warnings"
files = "^crates/[a-z-]+/benches/ir_gate\\.rs$"
pass_filenames = false
priority = "checks"

# The absolute line-ending rule, which `mixed-line-ending` does not express: it reports a
# file that mixes endings and stays quiet on one that is entirely CRLF - the shape this
# repository actually accumulated. Measured before adopting: an injected all-CRLF file
# left the builtin hook `Passed` while this script named its line count. It walks tracked
# *and* newly created files, because the failure arrives at creation time.
[[repos.hooks]]
id = "line-endings-lf"
name = "text files are LF-only"
language = "system"
entry = "python scripts/check_line_endings.py"
pass_filenames = false
priority = "checks"

# The crate matrix is a claim about which crates need a Python runtime, and nothing measured it: an
# engine crate could grow a `pyo3` edge, the extension could take a Rust test block back, and the
# only symptom would arrive later, as a Rust test leg that cannot start without an interpreter.
# `scripts/check_rust_python_decoupling.py` derives the matrix from the manifests themselves - no
# hand-written crate list - and enforces four rules: exactly one crate is a cdylib (the extension),
# no other crate's dependency closure carries a Python-runtime crate, the extension holds no Rust
# test tier and declares `[lib] test = false`, and every `required-features` entry names a declared
# feature that is not a default. It carries its own strict TOML reader, so it needs neither `cargo`
# nor `tomllib` and runs on the same Python 3.8 floor as the package - including in the Python test
# legs, where cargo is absent.
[[repos.hooks]]
id = "rust-python-decoupling"
name = "Rust crates stay free of the Python runtime"
language = "system"
entry = "python scripts/check_rust_python_decoupling.py"
files = "(^|/)Cargo\\.toml$|^crates/"
pass_filenames = false
priority = "checks"

[[repos.hooks]]
id = "changelog-mirror-sync"
name = "changelog mirror sync"
language = "system"
entry = "python scripts/check_changelog_mirrors.py"
files = "^(CHANGELOG\\.md|docs/(en|ja|ko|zh)/changelog\\.md)$"
priority = "checks"

# Each localized page must stay in its own writing system. Translations written with
# an assistant drift into neighbouring scripts (simplified Han in ja, kana in ko) and
# a human reviewer reading that language often cannot tell, because the intruding
# glyph looks like a variant of the intended one. Scope is every page, not just the
# changelog: the Korean changelog shipped clauses of Chinese prose while the gate was
# pinned to the changelog's `[Unreleased]` block and to a curated codepoint list.
[[repos.hooks]]
id = "cjk-localisation"
name = "localized script purity"
language = "system"
entry = "python scripts/check_cjk_localisation.py"
files = "^docs/(ja|ko|zh)/.*\\.md$"
priority = "checks"

[[repos.hooks]]
id = "i18n-check"
name = "i18n doc check"
language = "system"
entry = "python scripts/check_i18n.py"
files = "^docs/(en|ja|ko|zh)/.*\\.md$"
priority = "checks"

# A wrapped paragraph whose continuation line starts with an issue reference (`#292 branch
# as written, ...`) is not a continuation to a Markdown formatter: `rumdl fmt` promotes it
# into a heading, blanks around it, and the sentence is left split across a heading. Three
# such headings were in the tree at once while every gate stayed green, because a document
# with a bogus heading is still valid Markdown - nothing asked whether the heading was
# meant. The mechanism was reproduced, not inferred: a scratch file with the continuation
# line came out of `rumdl fmt` with `## 292 branch as written, and more`. The rule is a
# heading whose text starts with two or more digits not followed by a dot, measured against
# every tracked page so it fires on the damage and on none of `### 1-D array`,
# `#### 10. メタデータの操作` or `## 1. Test matrix coverage`.
[[repos.hooks]]
id = "doc-heading-integrity"
name = "no split-sentence headings"
language = "system"
entry = "python scripts/check_doc_headings.py"
files = "\\.md$"
priority = "checks"

# Prose here is hard-wrapped, and nothing enforced the wrap: `ROADMAP.md` reached one line of
# 21,850 characters, and the localized changelogs reached 884 because a tool that only breaks at
# spaces cannot wrap CJK at all. `rumdl fmt` stays the repository's Markdown formatter - excluding it
# left `MD007`/`MD012` findings on six lines it had been keeping honest - but measured through stdin
# it does not re-wrap prose at all: a 587-character English line and a 319-column Korean one pass
# straight through, and `line-length` configures only the linter, whose `MD013` this repository
# disables. So width was unowned until this hook, which reports any prose line past 100 **display
# columns** (fullwidth = 2) that a legal cut could bring inside, and skips the four whose shortest
# legal cut is already past the limit - each opens with a 101-127 column code span that must not be
# split. `--fix` reflows exactly the reported lines, which is what keeps two passes from overwriting
# each other; the probe that alternates them settles with neither rewriting anything. Scope is the six
# pages whose prose this repository grows continuously: the five release-note pages, the roadmap, and
# the development records under `docs/dev/` (quality ledger, engine boundaries, performance status) -
# outside the published site, so they carry no i18n mirror obligation but the same typographic one. The
# docs tree keeps its own wrapping.
[[repos.hooks]]
id = "doc-line-width"
name = "prose fits 100 display columns"
language = "system"
entry = "python scripts/check_doc_wrapping.py"
files = "^(CHANGELOG|ROADMAP)\\.md$|^docs/(en|ja|ko|zh)/changelog\\.md$|^docs/dev/[a-z-]+\\.md$"
priority = "checks"

# Every published page opens with a YAML block that decides its title, its `<meta description>`, its
# tags and its place in the navigation. The width fixer was written to skip that block and skipped only
# its opening `---`, so the body was joined and re-wrapped as prose: `title:`/`description:`/`tags:` on
# one line is not a mapping. The locked generator publishes such a page anyway, with the page's own
# description replaced by the site's; the newer one fails the build with `error reading page metadata`.
# A green deploy proved nothing either way, and the site is built on push to `main` rather than on pull
# requests, so three merged pull requests carried it. Structural rules only, so this hook needs nothing
# but the standard library. The second rule belongs here for the same reason: `md_in_html` parses the
# body of a raw HTML block only when the opening tag carries the `markdown` attribute, and a fold
# without it prints its own `####` headings, lists and code fences as text - which is how all 21 folded
# releases arrived on the site. GitHub parses `<details>` bodies either way, so the source looked right
# wherever a human read it. The third rule asks whether a fold exists at all: v0.18.1 and v0.18.2 were
# the only unfolded releases on five pages, and the rule that read the tag's attributes could not see a
# page missing one. Root `CHANGELOG.md` is in scope because it is the canonical English release note.
[[repos.hooks]]
id = "doc-metadata"
name = "page metadata parses and folds render"
language = "system"
entry = "python scripts/check_doc_metadata.py"
files = "^(CHANGELOG\\.md|docs/(en|ja|ko|zh)/.*\\.md)$"
priority = "checks"

# The file an agent trusts most was the one artefact outside the quality gate. `AGENTS.md` described
# `mkdocstrings` as configured-and-rendering-nothing and named `docs-generation:plugin-unused` as an open hole
# for a whole milestone after #321 had closed it, because the matrix compared the registry with the derived
# document and nothing read the prose - and the sentence was not merely stale, it pointed the next agent the
# wrong way about what to do with an API page. The rule is narrow on purpose: an id counts as a hole id only
# when `scripts/quality_matrix.py` can emit its kind, which is read off the probe rather than listed here, so
# `line:column` in a changelog entry is not a claim; and a named id must be one the measurement reproduces now.
# History keeps its ids - a released section and `docs/dev/quality-ledger.md` are dated records. Scope is
# present tense: the two agent files and the `[Unreleased]` block of the five release notes, because that block
# is the text the next cut turns into a dated record. `perf-coverage:binding-layer` was called an open hole in
# five mirrors, a ledger row, a test and a Rust doc comment across two pull requests with every gate green, so
# the release notes are in scope now and `tests/test_hole_claims_gate.py` falsifies both halves of that story.
[[repos.hooks]]
id = "hole-claims"
name = "present-tense files name measured holes"
language = "system"
entry = "python scripts/check_hole_claims.py"
files = "^(AGENTS|CLAUDE|CHANGELOG)\\.md$|^docs/(en|ja|ko|zh)/changelog\\.md$"
priority = "checks"

# The release is the only place that reads `.ci/requirements-test.txt`, so a missing test dependency arrived as a
# failed tag instead of a failed run: Publish for v0.18.2 reddened five wheel legs at collection because four test
# modules import `tomlkit` and `json5` at module scope and only the PR matrix's dev groups declare them. The rule
# charges a module-scope import that is neither the standard library nor this repository's own modules, and leaves
# a `try:`-guarded optional reader alone - charging those would push every optional import toward a bare import to
# keep the hook green, which is the wider hole.
[[repos.hooks]]
id = "wheel-requirements"
name = "wheel legs install what the suite imports"
language = "system"
entry = "python scripts/check_wheel_requirements.py"
pass_filenames = false
files = "^(\\.ci/requirements-test\\.txt|tests/.*\\.py)$"
priority = "checks"

# A live design document speaks in the present tense, and nothing read it: `docs/dev/event-stream.md` carried
# "decision 6 landed" for a day against a trunk that only had the docs-only commit `0a074148` - the split's code
# never merged, `git log origin/main -S owns_line -- '*.rs'` is empty there, and `event_notes.rs` never existed.
# `hole-claims` guards the instruction files against the measured matrix, so the artefact left outside every gate
# was a design doc's own claim about the code. The rule is narrow: a heading saying something landed or shipped
# carries the file - optionally `::symbol` - that makes it true, on the line under it. The hook fires on the code
# too, because deleting a symbol a live doc points at is the same defect seen from the other side.
[[repos.hooks]]
id = "landed-claims"
name = "live docs lock each landed claim to code"
language = "system"
entry = "python scripts/check_landed_claims.py"
pass_filenames = false
files = "^(docs/dev/.*\\.md|crates/.*\\.rs|python/pyrs_yaml/pyrs_yaml\\.pyi)$"
priority = "checks"

# Fires on either half of the pair: the page that quotes a floor, and the file those quotes must
# match. `pass_filenames = false` because the checker reads the governed page from its own path, so a
# staged baseline alone still re-checks the prose.
[[repos.hooks]]
id = "ir-floor-quotes"
name = "quoted Ir floors equal the committed baseline"
language = "system"
entry = "python scripts/check_ir_floor_quotes.py"
pass_filenames = false
files = "^(QUALITY_MATRIX\\.md|\\.ci/ir-baseline\\.json)$"
priority = "checks"

# A `python_version` cap on a counterparty library is a claim about what PyPI publishes, and five of
# the nine sat a whole band below their wheels while the ≥3.14 legs silently ran 236 fewer
# cross-library assertions (2026-10-28, measured from PR #665's per-leg summaries). The checker reads
# the wheel record against the legs CI actually schedules, so a cap that is too low or too high is a
# red hook rather than a coverage hole nobody counts.
[[repos.hooks]]
id = "counterparty-caps"
name = "counterparty version caps equal the recorded wheel availability"
language = "system"
entry = "python scripts/check_counterparty_caps.py"
pass_filenames = false
files = "^(pyproject\\.toml|uv\\.lock|\\.ci/counterparty-wheels\\.json|scripts/ci_matrix_plan\\.py|scripts/check_counterparty_caps\\.py|\\.github/workflows/ci\\.yml)$"
priority = "checks"

# The ledger's `### (xy)` letters are how a citation resolves. The rule was judged only by the Python
# tier until a head with one section placed a letter early reddened all twelve `test` legs while this
# hook's own job stayed green (2026-10-26), so the cheapest gate that can see it now does.
[[repos.hooks]]
id = "ledger-order"
name = "quality ledger sections run in letter order"
language = "system"
entry = "python scripts/check_ledger_order.py"
pass_filenames = false
files = "^docs/dev/quality-ledger\\.md$"
priority = "checks"

# `rumdl fmt` fixes `MD018` ("no space after a heading's hashes") by reading any line-initial run
# of hashes as a heading — inside a wrapped paragraph and inside a multi-line code span alike, both
# measured on the pinned 0.2.78. After the rewrite the line *is* a heading, so no check-priority
# hook can tell it from one the author meant, and `doc-heading-integrity` recognises only the
# `## 292 …` digit spelling of the damage. This slot is the only moment the shape is decidable:
# `format` priority (see `[priorities]`, format = 0 runs before checks = 10) and declared before
# the rumdl repo, which is what puts it ahead of the formatter in the run order.
[[repos.hooks]]
id = "doc-heading-preflight"
name = "no line-initial hash the formatter will promote"
language = "system"
entry = "python scripts/check_doc_headings.py --predamage"
pass_filenames = false
priority = "format"

# ── Python: ruff lint + format ──────────────────────────────────────────────
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.10"
hooks = [
  { id = "ruff", args = ["--fix"], priority = "checks" },
  { id = "ruff-format", priority = "format" },
]

# ── Markdown: rumdl lint + format ───────────────────────────────────────────
[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.78"
hooks = [
  { id = "rumdl", priority = "checks" },
  { id = "rumdl-fmt", priority = "format" },
]
