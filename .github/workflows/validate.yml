name: Validate

on:
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "docs/**/changelog.md"
      # Localized pages and the gate that polices them: the purity check used to be
      # a prek hook only, so nothing in CI ever ran it on a full tree.
      - "docs/**/*.md"
      - "scripts/check_cjk_localisation.py"
      # Page metadata is what the site generator reads, and the generator runs on push to `main`,
      # so a page the generator cannot read reaches trunk with every other gate green.
      - "scripts/check_doc_metadata.py"
      - ".github/workflows/publish.yml"
      - ".github/workflows/validate.yml"
      # Stub sources and the stub itself: the committed `.pyi` is machine output,
      # so a binding signature/docstring change, a generator (maturin) bump, or
      # an edit of the stub all have to land on the drift check below.
      - "crates/pyrs-yaml/src/**"
      - "python/pyrs_yaml/pyrs_yaml.pyi"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_stub_drift.py"
      # The job installs the extension into the venv so the derivation can read the exception types off
      # the live classes, so a binding change is this gate's business too.
      - "crates/pyrs-yaml/src/py/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check changelog mirrors
        run: python scripts/check_changelog_mirrors.py

  # Localized pages are written with assistance and drift into neighbouring scripts;
  # a reader of that locale usually cannot see it, because the intruding glyph looks
  # like a variant of the intended one. The gate scans every page of every locale and
  # fails on an empty scan, so a renamed directory cannot silently disable it. Only
  # stdlib is needed here; the gate's own unit tests live in `tests/` and run with the
  # rest of the suite in ci.yml, which has the built extension that `tests/conftest.py`
  # imports.
  script-purity:
    name: Localized pages stay in their own script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check ja/zh/ko docs for mixed-script intrusions
        run: python scripts/check_cjk_localisation.py

  # A joined `title:` / `description:` line is not a mapping. The locked generator publishes such a page
  # anyway with the page's description replaced by the site's; the newer one stops the build with
  # `error reading page metadata 'changelog.md'`. Four changelog pages carried exactly that joined block
  # for three merged pull requests, because the damage was inside every rule the tree had - the width
  # limit, the heading shape, the mirror checker - and the only thing that reads those lines, the site
  # build, runs on push rather than on pull requests. Stdlib only, so the job costs one checkout.
  page-metadata:
    name: Page metadata parses and folds render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every published page's front matter and fold markup
        run: python scripts/check_doc_metadata.py

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure publish.yml does not use --generate-stubs
        run: '! grep -q -- "--generate-stubs" .github/workflows/publish.yml'
      - name: Assert committed pyi is git-tracked
        run: git ls-files --error-unmatch python/pyrs_yaml/pyrs_yaml.pyi
      - name: Assert py.typed exists in source
        run: test -f python/pyrs_yaml/py.typed

  # The three assertions above only prove the committed stub *exists* and is
  # tracked; they cannot notice it drifting behind the binding, which is how a
  # wrong public typing contract ships inside every wheel. This job regenerates
  # the stub with the route AGENTS.md declares and fails on any content
  # difference, so the tracked `.pyi` has to stay derived rather than hand-patched.
  # Costs one debug Rust build plus a locked env sync on validate-triggering PRs;
  # the `build` job in ci.yml already spends more than that per OS.
  #
  # windows-latest, deliberately: maturin 1.14.1 generates stubs by importing the
  # freshly built extension from an isolated interpreter, and that route does not
  # work on Linux here. Measured, not assumed — on WSL (same locked maturin, same
  # uv.lock, Python 3.12) the sequence fails with "Failed to introspect the built
  # libraries… / No module named pyrs_yaml", and it keeps failing after building a
  # complete wheel and installing it non-editable so `python -I` resolves the
  # package inside site-packages. `experimental-inspect` is already enabled on the
  # pyo3 dependency, so maturin's own hint is not actionable either. The same
  # sequence succeeds on Windows (stub generated, drift check green), which is also
  # the platform the release process generates the committed stub on — pinning the
  # comparison to it keeps the gate checking the route that actually produces the
  # artifact. Revisit if upstream fixes Linux introspection; until then a Linux job
  # here would be a permanent red that gets reverted, not a gate.
  stub-drift:
    name: Committed type stub is derived
    runs-on: windows-latest
    steps:
      # Tags as well as commits: the gate's own negative control names the release whose shipped stub was
      # broken (`v0.17.0`), and a depth-1 checkout has no tags, so the control would skip forever.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: stubs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      # Locked, so the generator version is the one `uv.lock` pins rather than
      # whatever the maturin range allows on the day the PR happens to run.
      - name: Install locked build dependencies
        run: uv sync --frozen --no-install-project

      - name: Regenerate stubs (declared route)
        run: uv run --no-sync maturin generate-stubs --out target/stubs

      # The route reads the extension's exception types from the live classes, because maturin's own
      # introspection emits none of them (PyO3 `import_exception!` classes are not what its stub emitter
      # walks). `maturin generate-stubs` builds in an isolated environment, so it does not leave the module
      # importable in `.venv` — measured when this job first went red with `No module named 'pyrs_yaml'`.
      # Installing the built extension here is what lets the check ask the same question on a runner as it
      # can ask locally; without it the gate would either fail always or have to guess the list, and a
      # guessed list is the drift this job exists to prevent.
      - name: Install the built extension (the derivation reads it)
        run: uv run --no-sync maturin develop

      - name: Assert the committed stub matches the generated stub
        run: uv run --no-sync python scripts/check_stub_drift.py

      # "It parses" (ledger (bb)) is not "it type checks". mypy reported five errors inside the stub this
      # route produced - `u32`, an unimported `Callable`, three `Py<PyAny>` forward annotations - while every
      # AST-level check stayed green, so the gate asks a checker directly. Pinned rather than floating: a
      # gate whose behaviour changes because PyPI did is not a gate.
      - name: Assert the stub type checks (mypy)
        run: uv run --with 'mypy==2.4.0' python scripts/check_stub_types.py --checker mypy

      # Second checker, same artifact: `ty` found every defect mypy did, under different rule names, and is
      # scoped with `--ignore all --error <rule>` because unscoped it also raises strictness findings about
      # generator output that this gate is not here to settle. One trap belongs in the file that uses it:
      # `ty check <directory>` answers "All checks passed!" for a package holding only a `.pyi`, having found
      # no files - which is why the script names the file and refuses a vacuous run.
      - name: Assert the stub type checks (ty)
        run: uv run --with 'ty==0.0.85' python scripts/check_stub_types.py --checker ty

      # The two steps above assert the artifact is clean; this one asserts the gate would have noticed if it
      # were not, against the stub that actually shipped broken. It runs here and nowhere else because it needs
      # a checker installed *and* the git history, which no other job has: on the test legs both checkers are
      # absent and the tests skip, and a control that only ever runs on one laptop is a control in name only.
      - name: Assert the gate bites the artifact that shipped broken
        run: uv run --with 'mypy==2.4.0' --with 'ty==0.0.85' python -m pytest tests/test_stub_types_gate.py -q