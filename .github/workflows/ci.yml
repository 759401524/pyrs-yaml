name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYO3_BUILD_EXTENSION_MODULE: 1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: pyo3/maturin-action/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}
          interpreter: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run cargo tests
        if: matrix.os != 'macos-latest'
        run: cargo test --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Build wheel
        uses: pyo3/maturin-action/build@v1
        with:
          maturin-version: latest
          args: --release

      - name: Install Python test dependencies
        run: pip install -q pytest pytest-asyncio numpy

      - name: Run Python tests
        run: pytest tests/ -v --ignore=tests/benchmark_compare.py

  test-freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up free-threaded Python
        uses: pyo3/maturin-action/setup-python@v1
        with:
          python-version: "3.13t"
          interpreter: "3.13t"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run cargo tests
        run: cargo test --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Build wheel
        uses: pyo3/maturin-action/build@v1
        with:
          maturin-version: latest
          args: --release

      - name: Install Python test dependencies
        run: pip install -q pytest pytest-asyncio

      - name: Run Python tests
        run: pytest tests/ -v --ignore=tests/benchmark_compare.py -k "not numpy"
