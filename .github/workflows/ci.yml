name: CI

on:
  push:
    branches: [main]
  # Weekly, and it is the reason the pull-request tier is allowed to be cheap: the full
  # OS x interpreter cross product runs in full every Sunday, so a cell that was demoted to a smoke
  # leg on a pull request is still executed with the whole suite once a week rather than never.
  # Chosen over a nightly full grid because measured cost of one full grid is 78 minutes of runner
  # time, and the pull requests in this repository arrive at ~16 per week - nightly would spend more
  # on the cross product than the slim tier saves.
  schedule:
    - cron: "30 2 * * 0"
  # Unconditional on purpose. Branch protection requires the check named `Test matrix (all legs)`, and a
  # required check that never reports is not a green light - it is a deadlock. Measured on PR #319: a pull
  # request touching only `*.md` and `docs/**` ran every other workflow, every check it produced passed, and
  # the merge was refused with `Required status check "Test matrix (all legs)" is expected` because this
  # workflow's `paths-ignore` had excluded exactly those files. What a changeset owes the engine is decided
  # by the `changes` job below - which always runs - not by whether the workflow ran at all.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A rebase merge lands the *exact tree* the PR checks already verified green
  # (branch protection requires an up-to-date branch and passing checks before
  # the merge button unlocks), so re-running the full matrix on the resulting
  # `push: main` event is a second, identical ~1h spend with zero new
  # information. The heavy jobs below therefore run on `pull_request` and
  # `workflow_dispatch` only; `main-gate` keeps the default-branch run history
  # and status badge current for the push event itself.
  main-gate:
    name: main (verified on PR)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record what this run stands for
        run: |
          echo "push sha ${{ github.sha }} is the rebased tip whose identical tree already"
          echo "passed the full CI matrix as a pull request; skipping the duplicate spend."

  # The interpreter grid is planned rather than written out, by `scripts/ci_matrix_plan.py`. The
  # version list comes from `pyproject.toml`'s classifiers, so the matrix cannot drift away from the
  # range the package publishes; the coverage and compliance gates are *roles* attached to legs rather
  # than `matrix.os && matrix.python-version` conditionals, which is the difference between a cell
  # removal failing the plan and a cell removal quietly switching a gate off while everything stays
  # green. `--check` enforces that here, before any leg is paid for.
  matrix-plan:
    name: plan the interpreter grid
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    outputs:
      suite-legs: ${{ steps.plan.outputs.suite_legs }}
      smoke-legs: ${{ steps.plan.outputs.smoke_legs }}
      smoke-count: ${{ steps.plan.outputs.smoke_count }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 3.11 because the planner must run on an interpreter that is not itself in the grid it emits:
      # a plan computed by a leg of the plan could be tuned to that version's syntax ceiling. It is
      # also the version this repository's docs tooling already requires.
      - name: Validate the plan, then emit both tiers
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python scripts/ci_matrix_plan.py --check
          echo "suite_legs=$(python scripts/ci_matrix_plan.py --event "$EVENT")" >> "$GITHUB_OUTPUT"
          smoke=$(python scripts/ci_matrix_plan.py --event "$EVENT" --smoke)
          echo "smoke_legs=$smoke" >> "$GITHUB_OUTPUT"
          echo "smoke_count=$(python -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$smoke")" >> "$GITHUB_OUTPUT"

  # Everything the merge decision consumes is classified here first. Prose-only changes skip the heavy legs
  # *on purpose*, and the verdict is told that they were: `check_matrix_verdict.py` tolerates a skipped leg
  # only when this job reports `code=false` and refuses one when it reports `code=true`, so the
  # classification cannot be used to hide a leg that failed to run for another reason.
  changes:
    name: what the changeset touches
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            paths=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- ':(exclude)*.md' ':(exclude)docs/**')
            if [ -z "$paths" ]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "prose-only changeset: heavy legs are not owed"
              exit 0
            fi
            echo "changes outside prose: $(printf '%s\n' "$paths" | head -3)"
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"

  # The documentation is a built artifact with a renderer, and no pull request had ever built it:
  # `.github/workflows/docs.yml` triggers on push to `main`, which is how four changelog pages carrying
  # unreadable front matter reached the deployed site with every source-level gate green. Registered as
  # `docs-rendering:unbuilt-on-pr`; this job is its exit. Minutes, not a matrix.
  docs-gates:
    name: docs gates and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Pinned to the version the repository declares, the way `hygiene.yml` pins it: the hook set is the
      # gate and a floating install would change behaviour under it. Measured on this job's first run -
      # `error: Failed to spawn: prek / No such file or directory` - because `uv run --no-sync prek` assumed
      # the tool lived in the project environment, and `prek` is a tool, not a dependency.
      - name: Install prek
        run: uv tool install --from 'prek>=0.1.0' prek

      - name: Stdlib gates (metadata, width, mirrors, headings, script purity, i18n)
        run: |
          python scripts/check_doc_metadata.py
          python scripts/check_doc_headings.py
          python scripts/check_changelog_mirrors.py
          python scripts/check_cjk_localisation.py
          python scripts/check_i18n.py

      - name: Create virtualenv
        run: uv venv .venv

      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release

      # `--strict` is inside `scripts/build-docs.py`, so a warning is a failure here, and the width rule is
      # checked through the same hook the commit uses rather than a hand-written file list that can fall
      # behind the governed set.
      - name: Prose width, on the governed set
        run: prek run doc-line-width --all-files

      # A published page that types `f(path=...)` for a function accepting `content` is still valid HTML, so the
      # site builds green over it. The checker reads the shipped object, so it needs the extension this job has
      # just built - and the pytest tier runs the same rule for changes that touch no docs at all.
      - name: Published signatures match the shipped object
        run: uv run python scripts/check_doc_signatures.py

      - name: Build all four locales
        run: uv run --group docs python scripts/build-docs.py

  rust-lint:
    needs: [changes]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # `--all-targets`, not the default `--lib`-ish scope: the repository's own discipline
      # is `cargo clippy --all --all-targets -- -D warnings`, and linting only `src/` in CI
      # while tests, benches and examples go unlinted means a green PR can still break the
      # next person's hook run. Measured before adopting: the same command is clean locally
      # against the whole tree, so this closes a registered blind spot without trading a red.
      - name: Run cargo clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Run cargo tests
        env:
          PYO3_PYTHON: python
        run: cargo test --workspace --locked

  # The property tier above runs at proptest's default 256 cases, which is a sampling budget
  # sized for speed. `prop_toml_writer_is_fixed_point` needed more than 256 cases to reach the
  # shape that relocates a note inside a multi-line inline table: at the default count the
  # generator never produced two members where the first carries a same-line note, so the writer
  # looked stable. This job pays for the wider net with the one resource the default tier is
  # saving - about a minute of measured work per PR, on top of the compile already cached.
  # It is blocking because all three writer fixed points hold at 20 000 cases; the case count is
  # written inline rather than in an `env:` block so the defence measurement can see it.
  property-tier:
    name: property tier (20k cases)
    needs: [changes]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: property-tier

      - name: Elevated property tier
        env:
          PYO3_PYTHON: python
        run: PROPTEST_CASES=20000 cargo test --workspace --locked

  msrv-check:
    needs: [changes]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain at MSRV
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check at MSRV
        run: cargo check --workspace --locked

      - name: cargo test at MSRV
        run: cargo test --workspace --locked

  no-std-check:
    name: no_std
    needs: [changes]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `thumbv7em-none-eabi` has no std at all, so a stray `use std::…`,
      # an accidentally enabled `indexmap/std`, or a `format!` used outside a
      # `#[cfg(test)]` block all fail here as hard errors. Building a
      # `--target` that nobody can run is the only honest gate for a no_std
      # claim: every other job still links std, so none of them would notice.
      - name: Install Rust toolchain with bare-metal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: no-std

      - name: Build no_std foundation crates
        run: >
          cargo build
          --locked
          --no-default-features
          --target thumbv7em-none-eabi
          -p pyrs-ast
          -p pyrs-event
          -p pyrs-schema
          -p pyrs-json
          -p pyrs-toml

      # Building for `thumbv7em-none-eabi` proves the code links without std; it does not prove the
      # logic still works there, and the unit tests are the only thing that does - map lookups
      # agreeing with the node `Hash`/`Eq` impls, and no layout or ordering difference surviving the
      # feature split. It runs over every foundation crate, because until now only two of them were
      # covered: `cargo test --no-default-features -p pyrs-toml` did not even compile (a
      # recursion-limit case that spawns a thread to get a big stack), and nothing noticed, because
      # this step listed the other two. The widening is worth 112 host tests that have never run
      # without std - 58 in pyrs-json, 54 in pyrs-toml - and pyrs-event's test target compiling
      # there at all.
      - name: Run no_std unit tests on the host
        run: >
          cargo test --locked --no-default-features
          -p pyrs-ast
          -p pyrs-event
          -p pyrs-schema
          -p pyrs-json
          -p pyrs-toml

      # Re-enabling `std` must not have been "achieved" by deleting the
      # no_std path, so assert the default (std) configuration still compiles
      # for the same bare-metal-shaped code path. It is the same five crates the two steps above
      # cover, because a re-check that lists fewer crates than it just tested without std proves
      # the feature split only in one direction; `tests/test_no_std_gate.py` fails if the two lists
      # drift. Measured on this tree: all five compile with default features.
      - name: Build with the default std feature
        run: >
          cargo check --locked
          -p pyrs-ast
          -p pyrs-event
          -p pyrs-schema
          -p pyrs-json
          -p pyrs-toml

  test:
    needs: [build, changes, matrix-plan]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    strategy:
      # Measured reason: with the default `true`, one leg's failure cancelled 22 siblings mid-flight,
      # so a run that reported a real problem could say nothing about every other interpreter it was
      # supposed to characterise. A matrix exists to report per-cell results; cancelling them defeats it.
      fail-fast: false
      # The legs come from `matrix-plan` rather than an `os x python-version` cross product, for the
      # reason recorded in `scripts/ci_matrix_plan.py`: measured over 144 legs, a leg costs 138 s on
      # ubuntu, 186 s on macOS and 251 s on Windows and 76% of that is the suite re-running the same
      # assertions, so the cross product - not the version list - was the expensive part. The name is
      # written out because the plan carries extra flags, and the default rendering would append them
      # to every check name; branch protection and `check_matrix_verdict.py` both match on the name.
      matrix:
        include: ${{ fromJSON(needs.matrix-plan.outputs.suite-legs) }}
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Download abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist/

      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl

      # Every corpus the Python suite reads lives under the untracked `Reference/`, and each suite
      # `skipif`s its directory away, so a leg that fetches nothing reports a green run that checked
      # nothing. Shared with `test-freethreaded` through one composite action; the pairing is enforced
      # by `tests/test_ci_corpus_gates.py`, which resolves the action's own steps.
      - name: Fetch conformance corpora
        uses: ./.github/actions/fetch-corpora

      - name: Install Python test dependencies
        run: uv sync --group test --no-install-project

      # The coverage gate used to be its own job: the same suite, the same three corpora, the same wheel,
      # run a second time on ubuntu/3.12. Folding it into the leg that already runs that interpreter costs
      # one extra flag instead of a duplicate fan-out, and the flag is why this one leg keeps `-v` off:
      # `--cov-report=term-missing` is the readable half of the record.
      #
      # `matrix.coverage` rather than a comparison on os and version: measured, the condition
      # `matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'` silently stops holding the
      # moment a matrix edit drops or moves that cell, and the suite keeps passing with the threshold
      # never evaluated - a coverage gate that switches itself off green. The plan now owns the role,
      # and `scripts/ci_matrix_plan.py --check` refuses a plan without exactly one coverage leg.
      - name: Run Python tests
        run: >-
          uv run pytest tests/
          ${{ matrix.coverage
              && '--cov=pyrs_yaml --cov-report=term-missing --cov-fail-under=78 -q'
              || '-v' }}

      - name: Compliance summary
        if: matrix.compliance
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'tests')
          from test_yaml_suite import compute_compliance
          r = compute_compliance()
          print(f'Compliance: {r[\"rate\"]*100:.1f}% ({r[\"passed\"]}/{r[\"total\"]} passed)')
          " >> $GITHUB_STEP_SUMMARY

  build:
    needs: [changes]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}

      - name: Build abi3 wheel (for test jobs)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --interpreter python3 --out dist-test

      - name: Upload abi3 wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist-test/*.whl

      # The same recipe and the same compiler `publish.yml` ships, so the artifact the test jobs
      # install is the artifact users download, and the pinned toolchain is exercised on three OSes
      # per pull request rather than for the first time on a tag push. `maturin-action` takes the
      # toolchain as its `rust-toolchain` input; if that name or value ever stops resolving, this
      # leg fails instead of Release. `tests/test_publish_toolchain.py` keeps the pin equal to
      # `.ci/ir-baseline.json`, which is the compiler the instruction-count floors were measured on.
      - name: Build release wheels (find-interpreter)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: 1.97.1
          args: --release --find-interpreter --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  test-freethreaded:
    needs: [changes]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both free-threaded versions, for different reasons. `3.14t` is the one interpreter that
        # cannot load the `abi3t` wheel this project publishes - `abi3t-py315` starts one version later -
        # so it is the boundary publish.yml has to carry a dedicated `cp314t` artifact for. `3.15t` is
        # the floor where that stable-ABI wheel begins, and nothing else in CI installs it.
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: freethreaded-${{ matrix.python-version }}

      - name: Set up free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Build and install free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release

      # The same pairing the `test` legs honour: this job runs the whole suite, so it owes every corpus
      # the suite reads. `tests/test_ci_corpus_gates.py` derives the requirement from the tests themselves.
      - name: Fetch conformance corpora
        uses: ./.github/actions/fetch-corpora

      - name: Install Python test dependencies
        run: uv sync --group test --no-install-project

      - name: Run Python tests
        run: uv run pytest tests/ -v

  # The cross product, kept. Every (OS, interpreter) cell the suite tier does not run still installs the
  # wheel that cell would actually download and executes one round trip through each dialect, because the
  # claim being tested here is the one `docs/en/installation.md` makes: a single abi3 wheel from 3.9 to
  # 3.15 on three platforms. That claim is per-cell and cheap to check, and it is the part of the old 24-cell
  # matrix that was not already covered by another cell - the suite, by contrast, runs the same 2 500
  # assertions in every one of them. Measured cost of a leg without the suite is the setup the suite tier
  # already pays per OS: 22 s on ubuntu, 45 s on macOS, 68 s on Windows.
  #
  # Deliberately no `pytest` in this job's steps: `tests/test_ci_corpus_gates.py` decides which jobs owe
  # which corpus clones by looking for a whole-suite run, and a smoke tier that pretends to be one would
  # either inherit a requirement it does not need or hide the requirement from a job that does.
  wheel-smoke:
    name: wheel smoke (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [build, changes, matrix-plan]
    if: ${{ github.event_name != 'push' && needs.changes.outputs.code == 'true' && needs.matrix-plan.outputs.smoke-count != '0' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-plan.outputs.smoke-legs) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist/

      - name: Install the wheel the published way
        shell: bash
        run: pip install dist/*.whl

      # Import, then a round trip per format family: YAML with a comment and an anchor, the three JSON
      # dialects, and TOML - through the shipped module, not a test helper. It lives in `scripts/` on
      # purpose: a `python -c` program inside a YAML plain scalar is not valid YAML (`a: 1` reads as a
      # mapping, measured on this job's first draft), and every `scripts/*.py` is imported by the 3.9 leg
      # so this cannot quietly become 3.9-only syntax.
      - name: Exercise every dialect
        run: python scripts/wheel_smoke.py

  # Branch protection matches checks by name, and a matrix contributes one name per leg - fourteen
  # suite legs and ten smoke legs here, where it used to be twenty-four of the first. Measured
  # consequence, twice inside an hour: #298 was rebase-merged with
  # `test (windows-latest, 3.8)` never consulted (and that leg carried two checkers that cannot run on
  # the Python floor this package promises), and #299 went red on a formatter's unsquashed fix - a
  # check no merge decision consumes is a report, not a gate. This job is the single name to make
  # required: it waits on the whole test surface and turns it into one verdict.
  #
  # It waits on *every* job in this workflow, not only the test matrix: a fan-in over 3 of the 11 names
  # would let a red `clippy`, `no_std`, MSRV or property-tier merge exactly as before. Adding a job
  # here without adding it to the fan-in reddens
  # `tests/test_matrix_verdict_gate.py::test_the_fan_in_waits_on_every_job_in_the_workflow`, so the
  # list cannot quietly fall behind the file. `skipped` is a refusal, which is safe because every job
  # below runs on `pull_request` - the only event this verdict itself runs on.
  matrix-verdict:
    name: Test matrix (all legs)
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, matrix-plan, docs-gates, rust-lint, property-tier, msrv-check, no-std-check, build, test, wheel-smoke, test-freethreaded, compliance-report, i18n-check]
    runs-on: ubuntu-latest
    steps:
      # No checkout of the tree is needed for the verdict itself, but the checker lives in
      # `scripts/` and importing it is what exercises it on the interpreter that ships it.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      # 3.9 on purpose: the fan-in is the job that must never be the one that breaks, so it runs on
      # the floor of the supported range as well, and `scripts/check_matrix_verdict.py` carries the
      # lazy annotations that makes necessary.
      - name: Verdict over every leg
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: python scripts/check_matrix_verdict.py

  compliance-report:
    needs: [build, changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest
      - name: Install wheel
        run: pip install *.whl
      - name: Download YAML Test Suite
        shell: bash
        run: |
          if [ ! -d "Reference/yaml-test-suite" ]; then
            git clone --depth 1 https://github.com/yaml/yaml-test-suite.git Reference/yaml-test-suite
          fi
      - name: Install pytest
        run: pip install pytest pyyaml
      - name: Generate compliance report
        run: python tests/test_yaml_suite.py --json > compliance.json
      - uses: actions/upload-artifact@v7
        with:
          name: compliance-report
          path: compliance.json

  i18n-check:
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
      - name: Run i18n check
        run: python scripts/check_i18n.py

