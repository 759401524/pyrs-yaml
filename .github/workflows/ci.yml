name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - ".gitignore"
      - "prek.toml"
      - ".rumdl.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A rebase merge lands the *exact tree* the PR checks already verified green
  # (branch protection requires an up-to-date branch and passing checks before
  # the merge button unlocks), so re-running the full matrix on the resulting
  # `push: main` event is a second, identical ~1h spend with zero new
  # information. The heavy jobs below therefore run on `pull_request` and
  # `workflow_dispatch` only; `main-gate` keeps the default-branch run history
  # and status badge current for the push event itself.
  main-gate:
    name: main (verified on PR)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record what this run stands for
        run: |
          echo "push sha ${{ github.sha }} is the rebased tip whose identical tree already"
          echo "passed the full CI matrix as a pull request; skipping the duplicate spend."

  rust-lint:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo tests
        env:
          PYO3_PYTHON: python
        run: cargo test --workspace --locked

  msrv-check:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain at MSRV
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check at MSRV
        run: cargo check --workspace --locked

      - name: cargo test at MSRV
        run: cargo test --workspace --locked

  no-std-check:
    name: no_std
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `thumbv7em-none-eabi` has no std at all, so a stray `use std::…`,
      # an accidentally enabled `indexmap/std`, or a `format!` used outside a
      # `#[cfg(test)]` block all fail here as hard errors. Building a
      # `--target` that nobody can run is the only honest gate for a no_std
      # claim: every other job still links std, so none of them would notice.
      - name: Install Rust toolchain with bare-metal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: no-std

      - name: Build no_std foundation crates
        run: >
          cargo build
          --locked
          --no-default-features
          --target thumbv7em-none-eabi
          -p pyrs-ast
          -p pyrs-schema
          -p pyrs-json
          -p pyrs-toml

      # The hasher differs across the feature split (std: RandomState, no_std:
      # fixed-seed FxHash), so the unit tests are the only thing that proves
      # map lookups still agree with the node Hash/Eq impls on that path.
      - name: Run no_std unit tests on the host
        run: cargo test --locked --no-default-features -p pyrs-ast -p pyrs-schema

      # Re-enabling `std` must not have been "achieved" by deleting the
      # no_std path, so assert the default (std) configuration still compiles
      # for the same bare-metal-shaped code path.
      - name: Build with the default std feature
        run: cargo check --locked -p pyrs-ast -p pyrs-schema

  test:
    needs: [build]
    if: ${{ github.event_name != 'push' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Download abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist/

      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Download YAML Test Suite
        shell: bash
        run: |
          if [ ! -d "Reference/yaml-test-suite" ]; then
            git clone --depth 1 https://github.com/yaml/yaml-test-suite.git Reference/yaml-test-suite
          fi

      - name: Download toml-test corpus
        shell: bash
        run: |
          if [ ! -d "Reference/toml-test" ]; then
            git clone --depth 1 https://github.com/toml-lang/toml-test.git Reference/toml-test
          fi

      - name: Install Python test dependencies
        run: uv sync --group test --no-install-project

      - name: Run Python tests
        run: uv run pytest tests/ -v

      - name: Compliance summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'tests')
          from test_yaml_suite import compute_compliance
          r = compute_compliance()
          print(f'Compliance: {r[\"rate\"]*100:.1f}% ({r[\"passed\"]}/{r[\"total\"]} passed)')
          " >> $GITHUB_STEP_SUMMARY

  coverage:
    needs: [build]
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Download abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest
          path: dist/

      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Install Python test dependencies
        run: uv sync --group test --no-install-project

      - name: Coverage report + gate
        # Python wrapper coverage (Rust extension is measured separately).
        # Gate prevents regression below the measured baseline (91%).
        run: uv run pytest tests/ --cov=pyrs_yaml --cov-report=term-missing --cov-fail-under=78

  build:
    if: ${{ github.event_name != 'push' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}

      - name: Build abi3 wheel (for test jobs)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --interpreter python3 --out dist-test

      - name: Upload abi3 wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist-test/*.whl

      - name: Build release wheels (find-interpreter)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --find-interpreter --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  test-freethreaded:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: freethreaded

      - name: Set up free-threaded Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Build and install free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release

      - name: Download YAML Test Suite
        shell: bash
        run: |
          if [ ! -d "Reference/yaml-test-suite" ]; then
            git clone --depth 1 https://github.com/yaml/yaml-test-suite.git Reference/yaml-test-suite
          fi

      - name: Download toml-test corpus
        shell: bash
        run: |
          if [ ! -d "Reference/toml-test" ]; then
            git clone --depth 1 https://github.com/toml-lang/toml-test.git Reference/toml-test
          fi

      - name: Install Python test dependencies
        run: uv sync --group test --no-install-project

      - name: Run Python tests
        run: uv run pytest tests/ -v

  compliance-report:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest
      - name: Install wheel
        run: pip install *.whl
      - name: Download YAML Test Suite
        shell: bash
        run: |
          if [ ! -d "Reference/yaml-test-suite" ]; then
            git clone --depth 1 https://github.com/yaml/yaml-test-suite.git Reference/yaml-test-suite
          fi
      - name: Install pytest
        run: pip install pytest pyyaml
      - name: Generate compliance report
        run: python tests/test_yaml_suite.py --json > compliance.json
      - uses: actions/upload-artifact@v7
        with:
          name: compliance-report
          path: compliance.json

  i18n-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest"
      - name: Run i18n check
        run: python scripts/check_i18n.py

