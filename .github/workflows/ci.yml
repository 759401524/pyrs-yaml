name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - ".gitignore"
      - "prek.toml"
      - ".rumdl.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Run cargo tests
        if: matrix.os != 'macos-latest'
        env:
          PYO3_PYTHON: python
        run: cargo test --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release

      - name: Install Python test dependencies
        run: uv pip install -q pytest pytest-asyncio numpy jsonschema

      - name: Run Python tests
        run: uv run pytest tests/ -v --ignore=tests/benchmark_compare.py

      - name: Compliance summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'tests')
          from test_yaml_suite import compute_compliance
          r = compute_compliance()
          print(f'Compliance: {r[\"rate\"]*100:.1f}% ({r[\"passed\"]}/{r[\"total\"]} passed)')
          " >> $GITHUB_STEP_SUMMARY

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build abi3 wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --find-interpreter --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  test-freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up free-threaded Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Run cargo tests
        env:
          PYO3_PYTHON: python3.14t
        run: cargo test --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Build and install free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release

      - name: Install Python test dependencies
        run: uv pip install -q pytest pytest-asyncio jsonschema

      - name: Run Python tests
        run: uv run pytest tests/ -v --ignore=tests/benchmark_compare.py -k "not numpy"

  compliance-report:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v6
        with:
          name: wheels-ubuntu-latest
      - name: Install wheel
        run: pip install *.whl
      - name: Generate compliance report
        run: python tests/test_yaml_suite.py --json > compliance.json
      - uses: actions/upload-artifact@v6
        with:
          name: compliance-report
          path: compliance.json

  benchmark:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v6
        with:
          name: wheels-ubuntu-latest
      - name: Install wheel
        run: pip install *.whl
      - name: Install benchmark deps
        run: pip install pyyaml ruamel.yaml
      - name: Run benchmark
        run: uv run pytest tests/test_benchmark.py --benchmark-json=benchmark-results.json
      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmark-results.json