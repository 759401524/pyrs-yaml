name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYO3_BUILD_EXTENSION_MODULE: 1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run cargo tests
        if: matrix.os != 'macos-latest'
        run: cargo test --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release

      - name: Install Python test dependencies
        run: uv pip install -q pytest pytest-asyncio numpy

      - name: Run Python tests
        run: pytest tests/ -v --ignore=tests/benchmark_compare.py

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --find-interpreter

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/

  test-freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run cargo tests
        run: cargo test --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release -i python3.13t

      - name: Install Python test dependencies
        run: pip install -q pytest pytest-asyncio

      - name: Run Python tests
        run: pytest tests/ -v --ignore=tests/benchmark_compare.py -k "not numpy"
