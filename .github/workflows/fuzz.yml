# Continuous fuzzing of the six engine surfaces. The finding pipeline this
# enforces: crash -> minimized artifact (uploaded below) -> regression test in
# the owning crate -> seed added under fuzz/seeds/ -> fix.
# Two tiers, split by what each can promise. `pull_request` replays every
# committed seed with `-runs=0`: deterministic, so it can block a merge — a fix
# that regresses a historical crash cannot land. The *discovery* window (time-
# bounded exploration) runs on the schedule, on `workflow_dispatch` and on pushes
# to `main`: it is a sampler, and a sampler cannot be a merge gate while any
# input in the backlog is unfixed, because it would redden unrelated PRs on
# findings nobody has triaged yet. History: an earlier revision of this file made
# discovery blocking on PRs too, and within two runs it surfaced three distinct
# inputs (crash-1b01ac3f, fixed as #272; crash-a916de77 and crash-9b77aea4, open)
# — each of which would have blocked every engine PR until its own root cause was
# written. A discovered input returns to blocking duty the moment it is minimised,
# pinned and seeded: the seed tier is permanent, the sampler only finds.
# Individual fixes keep their own PRs (one root cause, one PR).
name: Fuzz

on:
  schedule:
    # Saturday 02:00 UTC — quiet enough that the six parallel nightly builds
    # never compete with review traffic on the shared runners.
    - cron: "0 2 * * 6"
  workflow_dispatch:
  pull_request:
    # libFuzzer runs every corpus input before it explores, so this replays each
    # committed fuzz/seeds/**/former-crash-*.seed deterministically: a fix that
    # regresses a historical crash cannot merge. The short discovery window is
    # what used to be missing — drift surfaced only on the weekend schedule,
    # after the offending change was already on main.
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    # Any change to the harness itself fuzzes immediately: a target that no
    # longer compiles must not rot silently until the next weekend.
    paths:
      - "fuzz/**"
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Discovery budget, for the events that explore. Pull requests ignore it: they
  # replay the corpus with -runs=0, which is what makes them gate-able. Scheduled
  # runs keep the long window, and `cargo fuzz` still replays the seeded corpus
  # before exploring, so a regression is caught there too.
  # It is a TOTAL: scripts/fuzz_rounds.sh divides it across FUZZ_ROUNDS, because
  # reading it per-round instead multiplies the wall clock by the round count.
  FUZZ_TIME: 600
  # Ceiling that budget has to fit under: the job's `timeout-minutes` (25) minus
  # room for the nightly build. The script refuses to start when FUZZ_TIME exceeds
  # it, so an over-set budget fails at once as a configuration error rather than
  # being killed mid-sampling at 25 minutes - a shape that reads exactly like "the
  # fuzzer found something" (this is what 417ef6's push run did). Change both lines
  # together, or the tier goes red for arithmetic, not for behaviour.
  FUZZ_CEILING_MINUTES: 22

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_yaml, yaml_roundtrip, parse_json, json_roundtrip, parse_toml, toml_roundtrip,
                 validate_schema]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # libFuzzer instrumentation rides -Zsanitizer on nightly; stable cannot
      # build the targets at all.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the nightly this harness is validated with (cargo fuzz
          # build + ~20 min of fuzzing clean on it); bump deliberately after a
          # local `cargo fuzz build`.
          # `cargo fuzz` defaults its Linux build target to musl for a
          # statically portable fuzzer binary, but libFuzzer/ASAN is
          # incompatible with musl's statically-linked libc ("sanitizer is
          # incompatible with statically linked libc"). Installing the musl
          # std (#223) only moved the failure from "can't find crate for core"
          # to that linker error (run 36977536975) — the real fix is the host
          # GNU target on the Fuzz step, where the sanitizer links a dynamic
          # libc. rust-src stays: the instrumented build-std path wants the
          # core/alloc sources.
          toolchain: nightly-2026-08-15
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz

      # Curated seeds (historical crash inputs + hand-written shape coverage)
      # seed the ephemeral corpus; everything the run discovers stays on the
      # ephemeral runner only — machine corpora never enter git history.
      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/*.seed fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz
        id: fuzz
        # Both modes live in scripts/fuzz_rounds.sh so the policy can be run (and
        # was run) outside CI: `-runs=0` replay on pull requests, which is
        # deterministic and therefore allowed to block a merge, and the sampled
        # discovery window with a per-round budget elsewhere, harvesting every
        # distinct crash signature one run finds. Reproduce the merge-blocking
        # half with:
        #   mkdir -p fuzz/corpus/<target>
        #   cp fuzz/seeds/<target>/*.seed fuzz/corpus/<target>/
        #   cargo fuzz run <target> --target x86_64-unknown-linux-gnu -- -runs=0
        shell: bash
        run: bash scripts/fuzz_rounds.sh ${{ matrix.target }}

      # A discovered crash is only actionable if the bytes survive the runner;
      # attach them to the failed job for the triage->seed->fix pipeline. The
      # step-outcome test is now redundant with failure() — the step fails the
      # job again — but it keeps the upload firing if a tolerance ever returns.
      - name: Upload crash artifacts
        if: failure() || steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/collected/${{ matrix.target }}/
          if-no-files-found: ignore

  # One place to read the whole picture: which of the four surfaces found
  # anything, and how many distinct signatures each reported. The matrix jobs stay
  # parallel and non-cancelling (`fail-fast: false`), so this only collects their
  # output - it never decides it.
  report:
    name: Aggregate crash report
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download crash artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: fuzz-artifacts-*
          path: crashes
          merge-multiple: false

      - name: Report every target's findings
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          total=0
          {
            echo "## Fuzz report"
            echo
            echo "| target | crash inputs | distinct signatures |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in crashes/*/; do
            name=$(basename "$d")
            # The archive holds both `artifacts/<target>/` and `collected/<target>/`, and
            # the second mirrors the first, so inputs are counted by file *name*, not by
            # path — counting paths reported 3 for 2 crash inputs (measured on run
            # 37533230933). Signatures come from findings.tsv, which scripts/fuzz_rounds.sh
            # writes as a normal file under the target's own directory; the previous step
            # looked for a dotfile at the archive root, where it has never existed, so that
            # column has been silently reading 0.
            files=$(find "$d" -name 'crash-*' -printf '%f\n' | sort -u | grep -c .)
            sigs=$(find "$d" -name 'findings.tsv' -exec cat {} + 2>/dev/null | cut -f1 | sort -u | grep -c .)
            total=$((total + files))
            echo "| ${name#fuzz-artifacts-} | $files | $sigs |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$total" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A signature names the assertion that failed, not the root cause: two bugs can" >> "$GITHUB_STEP_SUMMARY"
            echo "reach the same \`assert_eq!\`. Read the signature column as a lower bound." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$total crash input(s) collected; each owes the minimize -> regression test -> seed -> fix pipeline"
          fi
