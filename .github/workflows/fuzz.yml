# Continuous fuzzing of the four engine surfaces. The finding pipeline this
# enforces: crash -> minimized artifact (uploaded below) -> regression test in
# the owning crate -> seed added under fuzz/seeds/ -> fix.
# Two tiers: `pull_request` replays every committed seed (plus a short discovery
# window) so drift is caught by the PR that introduces it, while the schedule
# carries the long continuous-discovery budget. Individual fixes keep their own
# PRs (one root cause, one PR).
#
# Replay a round locally with:
#   mkdir -p fuzz/corpus/<target>
#   cp fuzz/seeds/<target>/*.seed fuzz/corpus/<target>/
#   cargo fuzz run <target> --target x86_64-unknown-linux-gnu \
#     -- -max_total_time=60 -rss_limit_mb=3072
# As of 2026-10-04 all four targets replay the committed seeds clean
# (5/17/6/5 seeds, nightly-2026-08-15, cargo-fuzz 0.13.2, GNU host target), so a
# fresh crash is a true positive about the PR that introduced it.
name: Fuzz

on:
  schedule:
    # Saturday 02:00 UTC — quiet enough that the four parallel nightly builds
    # never compete with review traffic on the shared runners.
    - cron: "0 2 * * 6"
  workflow_dispatch:
  pull_request:
    # libFuzzer runs every corpus input before it explores, so this replays each
    # committed fuzz/seeds/**/former-crash-*.seed deterministically: a fix that
    # regresses a historical crash cannot merge. The short discovery window is
    # what used to be missing — drift surfaced only on the weekend schedule,
    # after the offending change was already on main.
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    # Any change to the harness itself fuzzes immediately: a target that no
    # longer compiles must not rot silently until the next weekend.
    paths:
      - "fuzz/**"
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Per round, not per job: a round stops at its first crash (a Rust panic aborts
  # the process, so `-keep_going` cannot help — measured, see the Fuzz step), so
  # the budget is split across rounds and the loop keeps going until a round comes
  # back clean. PRs pay seed replay + three short rounds; schedule/dispatch/push
  # keep the long continuous-discovery budget.
  FUZZ_TIME: ${{ github.event_name == 'pull_request' && 60 || 300 }}
  FUZZ_ROUNDS: ${{ github.event_name == 'pull_request' && 3 || 5 }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_yaml, yaml_roundtrip, parse_json, parse_toml]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # libFuzzer instrumentation rides -Zsanitizer on nightly; stable cannot
      # build the targets at all.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the nightly this harness is validated with (cargo fuzz
          # build + ~20 min of fuzzing clean on it); bump deliberately after a
          # local `cargo fuzz build`.
          # `cargo fuzz` defaults its Linux build target to musl for a
          # statically portable fuzzer binary, but libFuzzer/ASAN is
          # incompatible with musl's statically-linked libc ("sanitizer is
          # incompatible with statically linked libc"). Installing the musl
          # std (#223) only moved the failure from "can't find crate for core"
          # to that linker error (run 36977536975) — the real fix is the host
          # GNU target on the Fuzz step, where the sanitizer links a dynamic
          # libc. rust-src stays: the instrumented build-std path wants the
          # core/alloc sources.
          toolchain: nightly-2026-08-15
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz

      # Curated seeds (historical crash inputs + hand-written shape coverage)
      # seed the ephemeral corpus; everything the run discovers stays on the
      # ephemeral runner only — machine corpora never enter git history.
      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/*.seed fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz
        id: fuzz
        # Rounds, dedupe and the corpus sweep live in scripts/fuzz_rounds.sh so
        # they can be run (and were: three probe sites, three signatures) outside
        # CI. Blocking everywhere, pull requests included: the step-level tolerance
        # that used to sit here was a ratchet, not a loophole - main carried drift
        # this tier correctly flagged - and a gate that can never be green gets
        # reverted rather than read.
        shell: bash
        run: bash scripts/fuzz_rounds.sh ${{ matrix.target }}

      # A discovered crash is only actionable if the bytes survive the runner;
      # attach them to the failed job for the triage->seed->fix pipeline. The
      # step-outcome test is now redundant with failure() — the step fails the
      # job again — but it keeps the upload firing if a tolerance ever returns.
      - name: Upload crash artifacts
        if: failure() || steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/collected/${{ matrix.target }}/
          if-no-files-found: ignore

  # One place to read the whole picture: which of the four surfaces found
  # anything, and how many distinct bugs each reported. The four matrix jobs stay
  # parallel and non-cancelling (`fail-fast: false`), so this only has to collect
  # their output - it never decides it.
  report:
    name: Aggregate crash report
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download crash artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: fuzz-artifacts-*
          path: crashes
          merge-multiple: false

      - name: Report every target's findings
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          total_files=0
          {
            echo "## Fuzz report"
            echo
            echo "| target | crash files | distinct signatures |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in crashes/*/; do
            name=$(basename "$d")
            files=$(find "$d" -name 'crash-*' | wc -l)
            sigs=0
            [ -f "$d/.signatures" ] && sigs=$(grep -c . "$d/.signatures")
            total_files=$((total_files + files))
            echo "| ${name#fuzz-artifacts-} | $files | $sigs |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$total_files" -gt 0 ]; then
            echo "::warning::$total_files crash input(s) collected; each needs the minimize -> regression test -> seed -> fix pipeline"
          fi
