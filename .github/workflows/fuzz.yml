# Continuous fuzzing of the four engine surfaces. The finding pipeline this
# enforces: crash -> minimized artifact (uploaded below) -> regression test in
# the owning crate -> seed added under fuzz/seeds/ -> fix.
# Two tiers: `pull_request` replays every committed seed (plus a short discovery
# window) so drift is caught by the PR that introduces it, while the schedule
# carries the long continuous-discovery budget. Individual fixes keep their own
# PRs (one root cause, one PR).
name: Fuzz

on:
  schedule:
    # Saturday 02:00 UTC — quiet enough that the four parallel nightly builds
    # never compete with review traffic on the shared runners.
    - cron: "0 2 * * 6"
  workflow_dispatch:
  pull_request:
    # libFuzzer runs every corpus input before it explores, so this replays each
    # committed fuzz/seeds/**/former-crash-*.seed deterministically: a fix that
    # regresses a historical crash cannot merge. The short discovery window is
    # what used to be missing — drift surfaced only on the weekend schedule,
    # after the offending change was already on main.
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    # Any change to the harness itself fuzzes immediately: a target that no
    # longer compiles must not rot silently until the next weekend.
    paths:
      - "fuzz/**"
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # PRs pay seed replay + a minute of discovery; schedule/dispatch/push keep the
  # long continuous-discovery budget. Regression coverage is identical either
  # way, because corpus replay is not time-limited - only exploration is.
  FUZZ_TIME: ${{ github.event_name == 'pull_request' && 60 || 600 }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_yaml, yaml_roundtrip, parse_json, parse_toml]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # libFuzzer instrumentation rides -Zsanitizer on nightly; stable cannot
      # build the targets at all.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the nightly this harness is validated with (cargo fuzz
          # build + ~20 min of fuzzing clean on it); bump deliberately after a
          # local `cargo fuzz build`.
          # `cargo fuzz` defaults its Linux build target to musl for a
          # statically portable fuzzer binary, but libFuzzer/ASAN is
          # incompatible with musl's statically-linked libc ("sanitizer is
          # incompatible with statically linked libc"). Installing the musl
          # std (#223) only moved the failure from "can't find crate for core"
          # to that linker error (run 36977536975) — the real fix is the host
          # GNU target on the Fuzz step, where the sanitizer links a dynamic
          # libc. rust-src stays: the instrumented build-std path wants the
          # core/alloc sources.
          toolchain: nightly-2026-08-15
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz

      # Curated seeds (historical crash inputs + hand-written shape coverage)
      # seed the ephemeral corpus; everything the run discovers stays on the
      # ephemeral runner only — machine corpora never enter git history.
      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/*.seed fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz
        id: fuzz
        # Ratchet, not a loophole. Tolerated on pull requests only, and set on the
        # STEP rather than the job: job-level continue-on-error still publishes a
        # failing check run, which is what a merge actually looks at, so it would
        # neither unblock PRs nor report cleanly. Main already carries drift this
        # tier correctly flags (crash-f44eca1d, after the predecessors fixed in
        # #256/#258/#261/#262), so while any backlog remains the check is a true
        # positive and red on every PR - and a gate that can never be green gets
        # reverted. Scheduled and manual runs stay blocking, keeping the long-window
        # signal. TODO: once the drift backlog is drained, delete this line so a
        # new crash hard-fails the PR that introduces it, turning the gate from
        # surfacing regressions into preventing them.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=${{ env.FUZZ_TIME }} -rss_limit_mb=3072

      # A discovered crash is only actionable if the bytes survive the runner;
      # attach them to the failed job for the triage->seed->fix pipeline. The
      # step-outcome test keeps this firing on PRs, where the tolerated step no
      # longer fails the job and so plain failure() would never match.
      - name: Upload crash artifacts
        if: failure() || steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
