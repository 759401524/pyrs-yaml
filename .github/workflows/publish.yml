# Adapted from maturin-generated template for the pyrs-yaml project
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
          manylinux: auto
      # A GIL-enabled `cp38-abi3` wheel cannot be installed on a free-threaded
      # interpreter (different ABI — PEP 803), and this build's `abi3t` wheel
      # only starts at CPython 3.15 (`abi3t-py315`), so cp314t needs its own
      # dedicated wheel. Windows and macOS already produce one from the host
      # interpreter; here the manylinux image's own free-threaded build is
      # reached directly. Restricted to x86_64: the aarch64 image *does*
      # carry cp314t, but maturin must execute the target interpreter for a
      # non-abi3 build, and under qemu-user on an x86_64 runner that exec
      # fails with `Exec format error (os error 8)` — proven by the first
      # dispatch run. i686/s390x/ppc64le images carry no cp314t at all.
      - name: Build free-threaded wheels
        if: ${{ matrix.platform.target == 'x86_64' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i /opt/python/cp314-cp314t/bin/python
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
      # The free-threaded wheel is exactly the artifact a normal-GIL test
      # interpreter cannot ever load, so it needs its own smoke run before it
      # can reach the Release. numpy stays excluded per the free-threaded test
      # policy.
      - name: pytest (free-threaded)
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          uv venv .venv-ft --python 3.14t
          source .venv-ft/bin/activate
          uv pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --reinstall
          pytest tests/ -v -k "not numpy"
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --reinstall
          pytest tests/ -v
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu24.04
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv python3-dev gcc g++ build-essential
          run: |
            set -e
            python3 -m venv .venv
            source .venv/bin/activate
            pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --force-reinstall
            pytest tests/ -v

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        run: |
          set -e
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c '
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --force-reinstall
            pytest tests/ -v
          '
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          install: |
            apk add py3-virtualenv py3-pip python3-dev gcc g++ build-base
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --force-reinstall
            pytest tests/ -v

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: pytest
        shell: bash
        run: |
          set -e
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --reinstall
          pytest tests/ -v

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: pytest
        run: |
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r .ci/requirements-test.txt pyrs-yaml --find-links dist --reinstall
          pytest tests/ -v

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  pyq:
    name: pyq (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The Linux legs build inside the official manylinux2014 images via
          # `cross` — native compilation against a CentOS 7 (glibc 2.17) libc
          # and linker, the community-standard floor that covers CentOS 7,
          # Ubuntu 16.04/18.04 and Debian 8/9 without hand-rolled cross
          # toolchains. An earlier zigbuild recipe pinned x86_64 slightly
          # lower (2.16, the `getauxval` floor) but needed a zig install, a
          # pinned armv7 linker and per-target glibc suffixes for one extra
          # minor version — not worth the moving parts when the whole zig
          # stack also proved never to have run (the first real dispatch
          # exposed `cargo zigbuild: no such command`). `std` doubles as the
          # build target; macOS and Windows build natively on their own
          # runners.
          - { label: linux-x86_64, runner: ubuntu-22.04, std: x86_64-unknown-linux-gnu, container: true }
          # `smoke_image`/`smoke_platform`: the *runtime* image the arm smoke
          # steps exec the binary in. Real pypa manylinux2014 images carry the
          # foreign arch (dispatch run 4 proved aarch64 end to green there).
          # NOT `cross-rs/<target>` — those are amd64 build environments with
          # no arm manifest layer at all (`no matching manifest for
          # linux/arm/v7`, dispatch run 6). armv7 uses the Debian official
          # image because quay.io rate-limits anonymous pulls (run 4) and
          # pypa publishes armv7l only on quay; Debian's official library
          # ships a linux/arm/v7 manifest, and a runtime only needs glibc
          # >= the binary's 2.17 floor (bookworm has 2.36).
          - { label: linux-aarch64, runner: ubuntu-22.04, std: aarch64-unknown-linux-gnu, container: true, qemu: true, smoke_platform: linux/arm64, smoke_image: quay.io/pypa/manylinux2014_aarch64 }
          - { label: linux-armv7, runner: ubuntu-22.04, std: armv7-unknown-linux-gnueabihf, container: true, qemu: true, smoke_platform: linux/arm/v7, smoke_image: debian:bookworm-slim }
          # `macos-15-intel`, not `macos-13`: the retired image left
          # `pyq (macos-x86_64)` stuck in `queued` for the entire duration of
          # dispatch runs 6 and 7 (every other job completed). The wheel
          # `macos` job builds x86_64 on macos-15-intel and has been green
          # across all seven runs — same proven label here.
          - { label: macos-x86_64, runner: macos-15-intel, std: x86_64-apple-darwin, container: false }
          - { label: macos-aarch64, runner: macos-14, std: aarch64-apple-darwin, container: false }
          - { label: windows-x86_64, runner: windows-latest, std: x86_64-pc-windows-msvc, container: false }
    env:
      # Keep the build tree out of `target/` so `dist/` holds only release
      # assets. Every step below mirrors cargo's own layout under this root.
      CARGO_TARGET_DIR: dist/pyq-build
    steps:
      - uses: actions/checkout@v7

      # qemu binfmt serves two consumers on the cross-arch legs: `cross`
      # runs the foreign-arch container under emulation, and the Smoke test
      # below executes the produced aarch64/armv7 binaries on an x86_64
      # runner. Without registration both fail with `Exec format error` —
      # proven by the first real publish.yml run (the workflow only executes
      # on tag/dispatch, so PR CI never surfaces such gaps).
      - name: Install QEMU
        if: ${{ matrix.platform.qemu }}
        uses: docker/setup-qemu-action@v4

      # `cross` pins nothing itself: it is the driver that runs `cargo build`
      # inside the pinned `ghcr.io/cross-rs/<target>` manylinux2014 images,
      # one tool covering all three Linux archs. Prebuilt via install-action
      # rather than a minutes-long `cargo install` compile.
      - name: Install cross
        if: ${{ matrix.platform.container }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.std }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: pyq-${{ matrix.platform.label }}

      # `--release` plus a stripped profile keeps the attached asset small;
      # without `strip` the raw debug info dwarfs the executable itself.
      # NOTE: no `--out-dir`/`--artifact-dir` here — both are nightly-only on
      # stable cargo, and every platform here runs the stable toolchain.
      - name: Build pyq
        run: >
          ${{ matrix.platform.container && 'cross' || 'cargo' }} build
          --locked
          --release
          --bin pyq
          --target ${{ matrix.platform.std }}
          --config profile.release.strip=true

      # A released artifact that cannot start is worse than no artifact: it
      # fails on the user's machine instead of at build time. Prove the binary
      # actually runs before it is downloadable. Emulated cross legs (arm)
      # exec it through `docker run -i` on a real pypa manylinux2014 runtime
      # image carrying the foreign arch (see the matrix comments for what
      # each dispatch run proved). The host has the qemu translator but no
      # foreign `/lib/ld-linux-*.so` loader, so a direct host exec dies
      # before `main`; `cross run` silently dropped program arguments (clap
      # no-arg help, exit 2). `-i` forwards the piped stdin the `get`
      # assertions read. x86_64 host exec is native; macOS/Windows run the
      # binary directly.
      - name: Smoke test pyq
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.platform.std }}"
          if [ -n "${{ matrix.platform.smoke_image }}" ]; then
            RUN=(docker run --rm -i --platform "${{ matrix.platform.smoke_platform }}" -v "$PWD:/io" -w /io "${{ matrix.platform.smoke_image }}" "dist/pyq-build/$TRIPLE/release/pyq")
          else
            BIN="dist/pyq-build/$TRIPLE/release/pyq"
            [ -x "$BIN" ] || BIN="$BIN.exe"
            RUN=("$BIN")
          fi
          "${RUN[@]}" --version
          "${RUN[@]}" --help > /dev/null
          printf 'name: pyrs\n' | "${RUN[@]}" get .name --raw | grep -qx pyrs
          printf '{"a":{"b":42}}\n' | "${RUN[@]}" get .a.b --raw | grep -qx 42

      # Stage exactly one file: the target dir also holds a `.d` depfile and,
      # on Windows, a `.pdb` that `strip=true` leaves orphaned and useless.
      - name: Compress pyq
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.platform.std }}"
          SRC="dist/pyq-build/$TRIPLE/release"
          mkdir -p dist/pyq
          if [ -f "$SRC/pyq.exe" ]; then cp "$SRC/pyq.exe" dist/pyq/; else cp "$SRC/pyq" dist/pyq/; fi
          tar -czf "dist/pyq-${{ matrix.platform.label }}.tar.gz" -C dist/pyq .

      - name: Upload pyq
        uses: actions/upload-artifact@v7
        with:
          name: pyq-${{ matrix.platform.label }}
          path: dist/pyq-${{ matrix.platform.label }}.tar.gz

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist, pyq]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      # `gh release create --verify-tag` shells out to git to prove the tag
      # exists before publishing notes, so this job needs a real checkout.
      # Without it v0.17.0 died with "fatal: not a git repository" *after*
      # `uv publish` had already succeeded — PyPI had the release, GitHub
      # did not, and the tag/notes/wheels had to be reconciled by hand.
      - uses: actions/checkout@v7
        with:
          # `--verify-tag` only needs the tag object itself, so a shallow
          # fetch is enough; fetching tags explicitly keeps `git rev-parse`
          # working even though checkout detaches HEAD.
          fetch-depth: 1
          fetch-tags: true
      - uses: actions/download-artifact@v8
      # Attestation covers everything a user can download: the wheels and the
      # sdist published to PyPI, plus the pyq binaries attached to the GitHub
      # Release. Both globs are deliberate: the pyq archives are built by a
      # plain `cargo build`, so nothing attests them in their own job.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            wheels-*/*
            pyq-*/*
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v10.2.0
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
      # GitHub Release was previously created by hand (`gh release create`) after
      # every publish, which is one more step to forget and one more place for the
      # published version and the tag to drift apart. Creating it here means the
      # release notes and the attached binaries are produced from the same tag
      # that PyPI was published from, and only after uv publish has succeeded.
      #
      # The release carries the pyq binaries ONLY. The wheels and the sdist are
      # on PyPI, which is the canonical home for the Python distribution;
      # mirroring the identical files on GitHub only creates a second copy that
      # can go stale and invites people to `pip install` from a hand-picked
      # download. pyq has no PyPI distribution at all, so the release is its
      # only distribution channel.
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            'pyq-*/*'
