name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup Rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - name: Install cargo-codspeed (fallback if quickinstall fails)
        run: cargo codspeed --version 2>/dev/null || cargo install cargo-codspeed
      - name: Build the benchmark target(s)
        run: cargo codspeed build
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          exclude-allocations: true
          run: cargo codspeed run

  python:
    name: Python benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Create virtualenv
        run: uv venv .venv
      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release
      - name: Install Python benchmark dependencies
        run: uv pip install -q -r .ci/requirements-test.txt
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          exclude-allocations: true
          run: >
            uv run --no-sync pytest --codspeed -m "benchmark"

  # Instruction counts, not wall time. The CodSpeed jobs above compare today's
  # runner against a baseline recorded on different hardware, which for sub-10%
  # effects is not reproducible: three consecutive pushes that each did strictly
  # less work reported -7.7%, -10.5% and -9.8% for the same benchmark set.
  # callgrind Ir repeats to ~0.001% on the same binary, so this job can hold a
  # real line - 0.5%, sized from two runner images agreeing to 0.0018% on one
  # commit. Each scenario is the largest of `--repeats` (3) measurements, because
  # the binding channel moves 0.83% run to run and a single sample of that would
  # let a no-op change trip the line. Measurement is tens of seconds; the build
  # dominates. See scripts/ir_gate.py.
  ir:
    name: Instruction-count baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install valgrind
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Install Rust toolchain
        # The baseline records the toolchain that produced its numbers, because a
        # codegen change moves every scenario at once and would otherwise show up
        # as an unexplained regression. Read the pin from the baseline so the two
        # cannot drift: re-baselining with `ir_gate.py --update` moves the pin too.
        id: toolchain
        run: |
          version=$(python3 -c "import json;print(json.load(open('.ci/ir-baseline.json'))['toolchain'].split()[1])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinning rustc $version (from .ci/ir-baseline.json)"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Measure and gate
        run: python3 scripts/ir_gate.py
      - name: How to re-baseline
        if: failure()
        run: >
          echo "If this movement is intended, regenerate the numbers on the enforcing image:";
          echo "gh workflow run 'Ir baseline refresh' --ref <branch>, then commit the artifact it uploads.";
          echo "A local scripts/ir_gate.py --update measures a different machine - which is how the";
          echo "committed values came to sit 1.42% above what this image reports for the same code.";
