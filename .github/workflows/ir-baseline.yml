name: Ir baseline refresh

# The instruction-count gate enforces numbers that were *generated somewhere else*.
# `scripts/ir_gate.py` says it plainly: a baseline generated in WSL and checked on a GitHub
# runner measured +1.45% apart on the most allocation-sensitive scenario - and the committed
# values turned out to carry exactly that offset, which is the second reason this job exists.
#
# This job closes the gap deliberately instead of by accident. It runs the same measurement on the
# same image the gate runs on, taking the largest of `--repeats` samples per scenario, and uploads
# the resulting file; committing the artifact moves every number to the environment that enforces
# them, and the tolerance can then be re-argued against a real repeat measurement instead of a
# cross-image guess.
#
# Nothing here is automatic on purpose: a baseline is a claim about the code, and a workflow that
# rewrites it whenever it likes would turn the gate into a mirror. Run it when the toolchain is
# pinned elsewhere, when a scenario is added, or when the drift is worth measuring - then read the
# diff it prints before committing anything.
#
# `workflow_dispatch` only lists workflows that exist on the default branch: dispatching this file
# from a pull-request head returns HTTP 404 until the file is on `main`. Measured, not assumed -
# the first attempt to use this job was made from a PR branch and was refused. So the order is:
# land the scenario change (with WSL-measured numbers), then dispatch here, then commit the
# artifact as its own change.
#
# The toolchain is read from the baseline rather than taken from `@stable`, for the reason the first
# real run of this job demonstrated: `stable` on the runner was rustc 1.99.0 while the committed
# numbers came from 1.97.1, and regenerating moved `serialize_medium` +6.7% and `serialize_small`
# +5.8% - the code was untouched. Committing that artifact would launder a compiler regression into
# the baseline and the gate would never see it. Moving the pin is a separate, deliberate act: pass
# `toolchain` below (e.g. `1.99.0`) when the upgrade *is* the change, and say so in the commit that
# lands the artifact.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: >-
          Rust version to measure with. Leave empty to use the version recorded in
          .ci/ir-baseline.json, so the artifact is comparable with the numbers it replaces.
          Set it (e.g. `1.99.0`) only to move the pin deliberately.
        required: false
        default: ""
      accept_drift:
        description: >-
          Space- or newline-separated scenario names whose movement past the tolerance is
          intended, one --accept-drift flag each. Leave empty for a refresh that may only move
          numbers inside the line the baseline itself enforces - which is the default because
          refusing is the point of the guard.
        required: false
        default: ""
      profile:
        description: >-
          Space- or newline-separated scenario names to attribute per function after the
          measurement, using the same `--profile` the gate documents. Leave empty for a
          refresh that reports totals only: attribution rebuilds with symbols and costs one
          extra callgrind pair per named scenario, and it answers "where" - which no floor ever did.
        required: false
        default: ""
      profile_top:
        description: >-
          How many ranked rows to print per profiled scenario. Empty leaves the row count to the
          gate's own --top default.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ir-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh:
    name: measure on the enforcing image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends valgrind

      # Same resolution the enforcing job uses: the pin travels with the baseline, so a regenerated
      # artifact is by construction comparable with the numbers it replaces. An explicit `toolchain`
      # input overrides it, which is how a deliberate upgrade gets measured.
      - name: Resolve the toolchain
        id: toolchain
        run: |
          requested="${{ inputs.toolchain }}"
          if [ -n "$requested" ]; then
            echo "toolchain=$requested" >> "$GITHUB_OUTPUT"
            echo "moving the pin: measuring with $requested (input)"
          else
            version=$(python3 -c "import json;print(json.load(open('.ci/ir-baseline.json'))['toolchain'].split()[1])")
            echo "toolchain=$version" >> "$GITHUB_OUTPUT"
            echo "measuring with $version, read from .ci/ir-baseline.json"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}

      # No build cache here. Not because it explains anything - it was tested as the cause of the
      # 1.44% gap between this job's `serialize_block_scalars` and the enforcing job's, and REFUTED:
      # with the cache step removed this job still reported 15,792,928 while `codspeed.yml`'s
      # `Instruction-count baseline` job reported 16,020,9xx (see `scripts/ir_gate.py` for the
      # measurements and the two hypotheses this finding has already outlived).
      #
      # That gap is history rather than a standing property of these two jobs: it predates the ISA
      # pinning in `MEASUREMENT_ENV`, and on 2026-10-11 both jobs measured the same binaries (sha256
      # `364e072f5fea6687` and `a64ca39b772fae54`, printed by each) and landed 21 instructions apart on
      # that scenario. Pair the digests before comparing any two runs - `ir_gate.py` prints them as
      # `binaries:` lines for this reason, and writes them into the baseline. What the absent cache
      # guarantees is that a hand-dispatched measurement job starts from a tree nobody else warmed,
      # which is the only way its numbers are comparable with a gate that builds fresh.

      - name: Measurement environment
        # `ir_gate.py` prints the SHA-256 of each binary it measures; this is the machine around
        # those bytes, so a difference between two jobs can be attributed rather than argued.
        run: |
          echo "nproc=$(nproc)"
          echo "valgrind=$(valgrind --version)"
          rustc -vV
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Measure and rewrite the baseline
        # `ir_gate.py --update` refuses to write a file that moves a scenario up past the line the
        # baseline itself enforces, unless that scenario is named (`drift_report`, added in #345). The
        # guard is right and the channel could not honour it: measured on 2026-10-12, a dispatch on the
        # #360 head ran the whole measurement, printed all twenty-one samples, and then exited on
        # "--update would move 3 scenario(s) past the 0.5% line" with nothing written. A refresh that
        # is meant to record an intended cost was therefore impossible to produce here, which is the
        # only way a baseline can be moved by the change that grew it instead of around it. An empty
        # input keeps the plain `--update`: the refusal stays the default, and a name that matches no
        # scenario the guard reported is simply unused, so a typo redds the job rather than passing.
        env:
          ACCEPT_DRIFT: ${{ inputs.accept_drift }}
        run: |
          set -euo pipefail
          # Defensive, not load-bearing: measured on bash 5.x, `read -ra names` over an empty
          # here-string yields an empty array and status 0, so the default input reaches the "no
          # scenario named" branch with or without this. It stays because a non-zero status here would
          # abort the step under `set -e` before the branch that explains itself in the log.
          read -ra names <<< "$ACCEPT_DRIFT" || true
          args=()
          for name in "${names[@]+"${names[@]}"}"; do
            args+=(--accept-drift "$name")
          done
          # Count the names, not the flags: `args` holds two entries per scenario, and the first real
          # use of this input (run 38326122129, three names) logged "accepting drift for 6
          # scenario(s)". A reviewer reads this line to decide whether an artefact was opened on
          # purpose, so the number it carries has to be the number of scenarios.
          if [ ${#names[@]} -gt 0 ]; then
            echo "accepting drift for ${#names[@]} scenario(s): ${names[*]}"
          else
            echo "no scenario named: any move past the tolerance will refuse to be written"
          fi
          python3 scripts/ir_gate.py --update "${args[@]+"${args[@]}"}"

      - name: What moved
        # Numbers travel with a review. A human reads this before committing, because the file
        # this job produces is an artifact, not a push: regenerating a baseline is a decision.
        run: |
          echo "### .ci/ir-baseline.json"
          git --no-pager diff -- .ci/ir-baseline.json
          echo "### scenario count"
          python3 -c "import json;d=json.load(open('.ci/ir-baseline.json'));print(len(d['scenarios']), 'scenarios,', d['toolchain'])"

      - name: Per-function attribution
        # A floor says how much a scenario costs, never where. `--profile` is the tool for
        # that question and it has only ever been run by hand, which is how a -21% reading on
        # a scanner scenario stayed unattributed: the local profile and the committed floor are
        # different builds, so the pair nobody can compare is not evidence (`docs/dev/quality-ledger.md`
        # (gk)). This step makes the image produce it on request. It costs a second build - the
        # gate sets `CARGO_PROFILE_RELEASE_STRIP=false` for a profile, because a stripped binary
        # profiles as a table of addresses - plus one callgrind pair per named scenario, and it
        # cannot move the floor: a profile run returns before the measurement, so the baseline the
        # previous step wrote is exactly what that step measured.
        if: ${{ inputs.profile != '' }}
        env:
          PROFILE: ${{ inputs.profile }}
          PROFILE_TOP: ${{ inputs.profile_top }}
        run: |
          set -euo pipefail
          read -ra want <<< "$PROFILE"
          echo "attributing ${#want[@]} scenario(s): ${want[*]}"
          args=()
          for name in "${want[@]}"; do
            args+=(--profile "$name")
          done
          if [ -n "${PROFILE_TOP:-}" ]; then
            python3 scripts/ir_gate.py "${args[@]}" --top "$PROFILE_TOP"
          else
            python3 scripts/ir_gate.py "${args[@]}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ir-baseline-${{ github.run_number }}
          path: .ci/ir-baseline.json
          if-no-files-found: error
