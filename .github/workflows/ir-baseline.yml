name: Ir baseline refresh

# The instruction-count gate enforces numbers that were *generated somewhere else*.
# `scripts/ir_gate.py` says it plainly: a baseline generated in WSL and checked on a GitHub
# runner measured +1.45% apart on the most allocation-sensitive scenario, which is why the
# tolerance is 2% and not 0.1% - the margin is spent on the environment gap, not on noise.
#
# This job closes that gap deliberately instead of by accident. It runs the same measurement on
# the same image the gate runs on and uploads the resulting file; committing the artifact moves
# every number to the environment that enforces them, and the tolerance can then be re-argued
# against a real repeat measurement instead of a cross-image guess.
#
# Nothing here is automatic on purpose: a baseline is a claim about the code, and a workflow that
# rewrites it whenever it likes would turn the gate into a mirror. Run it when the toolchain is
# pinned elsewhere, when a scenario is added, or when the drift is worth measuring - then read the
# diff it prints before committing anything.
#
# `workflow_dispatch` only lists workflows that exist on the default branch: dispatching this file
# from a pull-request head returns HTTP 404 until the file is on `main`. Measured, not assumed -
# the first attempt to use this job was made from a PR branch and was refused. So the order is:
# land the scenario change (with WSL-measured numbers), then dispatch here, then commit the
# artifact as its own change.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ir-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh:
    name: measure on the enforcing image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Install Rust toolchain
        # Not the baseline's pin: the point of this job is to record the toolchain that produced
        # the new numbers, and `ir_gate.py --update` writes that pin into the file it emits.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ir-baseline

      - name: Measure and rewrite the baseline
        run: python3 scripts/ir_gate.py --update

      - name: What moved
        # Numbers travel with a review. A human reads this before committing, because the file
        # this job produces is an artifact, not a push: regenerating a baseline is a decision.
        run: |
          echo "### .ci/ir-baseline.json"
          git --no-pager diff -- .ci/ir-baseline.json
          echo "### scenario count"
          python3 -c "import json;d=json.load(open('.ci/ir-baseline.json'));print(len(d['scenarios']), 'scenarios,', d['toolchain'])"

      - uses: actions/upload-artifact@v7
        with:
          name: ir-baseline-${{ github.run_number }}
          path: .ci/ir-baseline.json
          if-no-files-found: error
