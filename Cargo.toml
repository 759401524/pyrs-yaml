[package]
name = "pyyaml-rs"
version = "0.3.0"
edition = "2021"
description = "High-performance Python YAML library with perfect round-trip support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/759401524/pyyaml-rs"
keywords = ["yaml", "python", "pyo3", "round-trip", "high-performance"]
categories = ["parser-implementations", "encoding"]

[lib]
name = "pyyaml_rs"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "experimental-inspect", "abi3-py39"] }
numpy = "0.29"
indexmap = "2.7"
saphyr-parser = "0.0.11"
serde_json = "1.0"
rust-i18n = "4.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "yaml_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
