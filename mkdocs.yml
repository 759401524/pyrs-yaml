site_name: pyyaml-rs
site_url: https://github.com/759401524/pyyaml-rs
site_description: High-performance Python YAML library with perfect round-trip support, built with Rust and PyO3
site_author: MuLong <759401524@qq.com>
repo_url: https://github.com/759401524/pyyaml-rs
repo_name: 759401524/pyyaml-rs
edit_uri: https://github.com/759401524/pyyaml-rs/edit/main/docs/{locale}{path}?lang={locale}
docs_dir: docs

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: true
            show_signature: true
            show_docstring_attributes: true
            show_root_heading: true
            show_root_toc_entry: false
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            docstring_section_style: table
            docstring_style: google
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
        - locale: ja
          name: 日本語
          build: true
        - locale: ko
          name: 한국어
          build: true

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
      baselevel: 1
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/759401524/pyyaml-rs
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyyaml-rs/
  analytics:
    provider: false
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize you when we visit our websites.
      That's what gives us the ability to personalize content for you.
      You can opt out at any time.
  status:
    new: New
    deprecated: Deprecated
  version:
    provider: mike
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
    - name: 日本語
      link: /ja/
      lang: ja
    - name: 한국어
      link: /ko/
      lang: ko

nav:
  - Home: en/index.md
  - Getting Started:
      - Installation: en/installation.md
      - Quick Start: en/quick-start.md
      - Features: en/features.md
  - User Guide:
      - Parsing YAML: en/guides/parsing.md
      - Serialization: en/guides/serialization.md
      - PyYAML Compatibility: en/guides/pyyaml-compat.md
      - Round-Trip Preservation: en/guides/round-trip.md
      - Markdown Frontmatter: en/guides/frontmatter.md
      - i18n Error Messages: en/guides/i18n.md
      - NumPy ndarray: en/guides/numpy.md
  - API Reference:
      - Module Reference: en/api/reference.md
      - YamlDocument Class: en/api/yaml-document.md
      - Exceptions: en/api/exceptions.md
  - Performance:
      - Benchmarks: en/performance/benchmarks.md
      - Comparison: en/performance/comparison.md
  - Contributing:
      - Development Setup: en/contributing/setup.md
      - Architecture: en/contributing/architecture.md
      - Coding Standards: en/contributing/standards.md
      - Running Tests: en/contributing/tests.md
  - Changelog: en/changelog.md
  - License: en/license.md